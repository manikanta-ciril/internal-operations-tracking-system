    * {
      box-sizing: border-box;
    }

    html {
      --bg: #f3f2ee;
      --surface: #fff;
      --surface-soft: #f8f7f4;
      --ink: #202830;
      --muted: #62655f;
      --line: #e5e3dc;
      --gold: #c09860;
      --gold-ink: #886338;
      --gold-soft: #f3ebdf;
      --green: #496852;
      --green-bg: #e8efe7;
      --amber: #8b611c;
      --amber-bg: #fbf0d9;
      --red: #a44747;
      --red-bg: #f9e8e5;
      color-scheme: light;
      background: var(--bg);
      font-size: 14px;
      scroll-behavior: smooth;
    }

    html[data-theme="dark"] {
      --bg: #1c232a;
      --surface: #222a32;
      --surface-soft: #29313a;
      --ink: #f4f4f0;
      --muted: #b7bebc;
      --line: #3d454a;
      --gold-ink: #dfbc8b;
      --gold-soft: #3b342c;
      --green: #b7d1bb;
      --green-bg: #2c3b32;
      --amber: #edca8a;
      --amber-bg: #403728;
      --red: #efb2aa;
      --red-bg: #422f31;
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
    }

    ::selection {
      background: #c098604f;
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      touch-action: manipulation;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    input,
    textarea {
      caret-color: var(--gold-ink);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
      opacity: 0.85;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #a59f9270;
      border-radius: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 30px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    h2 {
      font-size: 17px;
      line-height: 1.4;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    h3 {
      font-size: 14px;
      font-weight: 650;
      margin: 22px 0 12px;
    }

    p {
      color: var(--muted);
    }

    small {
      font-size: 11px;
      color: var(--muted);
    }

    svg {
      flex-shrink: 0;
    }

    strong {
      font-weight: 600;
    }

    main:focus,
    h1:focus {
      outline: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      padding: 12px;
      background: var(--ink);
      color: var(--surface);
      transform: translateY(-150%);
      z-index: 100;
    }

    .skip-link:focus {
      transform: none;
    }

    .shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 32px 18px 22px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      min-width: 0;
    }

    .sidebar-brand {
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand img {
      width: 126px;
      height: 45px;
      object-fit: contain;
      object-position: left;
    }

    .sidebar-caption {
      font-size: 11px;
      color: var(--muted);
      margin: 30px 14px 14px;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sidebar nav>a {
      min-height: 46px;
      padding: 11px 13px;
      border-radius: 8px;
      display: flex;
      gap: 11px;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--muted);
    }

    .sidebar nav>a:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .sidebar nav>a.active {
      background: var(--gold-soft);
      color: var(--gold-ink);
    }

    .sidebar nav .help-nav {
      margin-top: 22px;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding-top: 22px;
    }

    .count {
      font-size: 10px;
      display: grid;
      place-items: center;
      min-width: 19px;
      height: 19px;
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-radius: 5px;
      margin-left: auto;
    }

    .sidebar-account {
      margin-top: auto;
      padding: 22px 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    .sidebar-account strong,
    .sidebar-account span:not(.avatar) {
      display: block;
      font-size: 12px;
    }

    .sidebar-account div>span {
      color: var(--muted);
      font-size: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gold-soft);
      color: var(--gold-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 650;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar.large {
      width: 82px;
      height: 82px;
      font-size: 27px;
      border-radius: 18px;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 82px;
      border-bottom: 1px solid var(--line);
      padding: 16px 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
    }

    .breadcrumb {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .breadcrumb strong {
      color: var(--ink);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .role-picker {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      color: var(--muted);
    }

    .role-picker select {
      max-width: 190px;
      font-size: 11px;
      min-height: 34px;
      background: transparent;
      border-color: var(--line);
    }

    .icon-button {
      background: none;
      border: 0;
      color: inherit;
      min-width: 36px;
      min-height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      font-size: 22px;
    }

    .icon-button:hover {
      background: var(--gold-soft);
    }

    .mobile-menu {
      display: none;
    }

    .header-avatar {
      display: flex;
    }

    .preview-note {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 38px;
      color: var(--gold-ink);
      font-size: 11px;
      background: var(--gold-soft);
    }

    .preview-note>span:last-child {
      color: var(--muted);
    }

    .preview-dot {
      width: 5px;
      height: 5px;
      background: var(--gold-ink);
      border-radius: 50%;
    }

    main {
      padding: 34px 38px 42px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      min-width: 0;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .page-heading p {
      margin-top: 8px;
      font-size: 13px;
      max-width: 65ch;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      padding: 10px 17px;
      background: var(--ink);
      color: var(--surface);
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      white-space: normal;
      text-align: center;
    }

    .button:hover {
      opacity: 0.88;
    }

    .button.secondary {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink);
    }

    html[data-theme="dark"] .button:not(.secondary) {
      background: var(--gold);
      color: #202830;
    }

    html[data-theme="dark"] .button.secondary {
      background: transparent;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--gold-ink);
      font-size: 12px;
      font-weight: 550;
      background: none;
      border: none;
      padding: 0;
      line-height: 1.5;
      text-underline-offset: 4px;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .text-link.spaced {
      display: flex;
      width: fit-content;
      margin-top: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 8px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .badge.green {
      background: var(--green-bg);
      color: var(--green);
      border-color: transparent;
    }

    .badge.amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: transparent;
    }

    .identity-banner {
      padding: 26px 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .identity-text {
      flex: 1;
      min-width: 0;
    }

    .identity-text h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
      font-weight: 600;
    }

    .identity-text>p {
      font-size: 12px;
      margin: 5px 0 12px;
    }

    .inline-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .inline-meta>span {
      overflow-wrap: anywhere;
    }

    .dot-separator {
      padding: 0 6px;
      color: var(--gold);
    }

    .identity-state {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
      gap: 7px;
    }

    .identity-state>span:not(.badge) {
      font-size: 10px;
      color: var(--muted);
    }

    .identity-state .text-link {
      margin-top: 6px;
    }

    .profile-tabs {
      display: flex;
      gap: 28px;
      border-bottom: 1px solid var(--line);
      margin: 18px 0 26px;
      flex-wrap: wrap;
    }

    .profile-tabs a {
      font-size: 12px;
      padding: 13px 0;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }

    .profile-tabs a[aria-current="page"] {
      color: var(--gold-ink);
      border-color: var(--gold);
    }

    .two-columns {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-bottom: 22px;
    }

    .two-columns>.panel {
      margin-bottom: 0;
      height: 100%;
    }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-heading p {
      font-size: 11px;
      line-height: 1.6;
      margin-top: 4px;
      max-width: 65ch;
    }

    .section-heading .text-link {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .panel>p {
      font-size: 12px;
      line-height: 1.8;
      margin: 10px 0 18px;
      max-width: 75ch;
    }

    .data-list {
      margin: 0;
    }

    .data-list>div {
      display: grid;
      grid-template-columns: 42% minmax(0, 1fr);
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      align-items: start;
    }

    .data-list>div:last-child {
      border: 0;
    }

    .data-list dt {
      color: var(--muted);
    }

    .data-list dd {
      margin: 0;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .caption {
      font-size: 10px !important;
      line-height: 1.7 !important;
      color: var(--muted);
      margin-top: 15px !important;
    }

    .heatmap-months {
      display: flex;
      justify-content: space-between;
      padding: 0 4px 9px 33px;
      font-size: 10px;
      color: var(--muted);
    }

    .heatmap-wrap {
      display: flex;
      gap: 11px;
      width: 100%;
    }

    .week-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 22px;
      font-size: 9px;
      color: var(--muted);
    }

    .heatmap {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 5px;
      flex: 1;
      min-width: 0;
    }

    .day-cell {
      display: block;
      aspect-ratio: 1;
      border-radius: 3px;
      min-width: 0;
      background: var(--surface-soft);
      transition: opacity 0.15s;
    }

    .day-cell:hover {
      outline: 2px solid var(--gold-ink);
      outline-offset: 1px;
    }

    .present {
      --day-color: #929f7d;
      background: var(--day-color);
    }

    .leave {
      --day-color: #dbc391;
      background: var(--day-color);
    }

    .holiday {
      --day-color: #eeece5;
      background: var(--day-color);
    }

    .absent {
      --day-color: #c8948c;
      background: var(--day-color);
    }

    .incomplete {
      --day-color: #e9c184;
      background: var(--day-color);
    }

    .missing {
      --day-color: transparent;
      background: var(--day-color);
      outline: 1px dashed #a4a198;
      outline-offset: -1px;
    }

    html[data-theme="dark"] .present {
      --day-color: #637c5e;
    }

    html[data-theme="dark"] .leave {
      --day-color: #a38a59;
    }

    html[data-theme="dark"] .holiday {
      --day-color: #354047;
    }

    html[data-theme="dark"] .absent {
      --day-color: #a4746d;
    }

    html[data-theme="dark"] .incomplete {
      --day-color: #b48e55;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 13px;
      margin-top: 18px;
    }

    .legend>span {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      font-size: 9px;
      color: var(--muted);
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }

    .today-row {
      display: flex;
      gap: 13px;
      align-items: center;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-top: 17px;
      margin-top: 18px;
      font-size: 10px;
      color: var(--muted);
    }

    .today-row>span:first-child {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .today-row svg {
      width: 14px;
    }

    .today-row strong {
      color: var(--ink);
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .action-row:last-child {
      border: 0;
    }

    .action-row small {
      display: block;
      font-size: 10px;
      margin-top: 5px;
    }

    .action-row:hover {
      color: var(--gold-ink);
    }

    .workspace-foot {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 20px 38px;
      color: var(--muted);
      font-size: 10px;
      border-top: 1px solid var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 16px 0;
    }

    .field>label {
      font-size: 12px;
      font-weight: 550;
    }

    .field small {
      font-size: 10px;
      line-height: 1.7;
    }

    input:not([type="checkbox"]):not([type="range"]):not([type="file"]),
    select,
    textarea {
      width: 100%;
      min-width: 0;
      min-height: 41px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 11px;
      color: var(--ink);
      font-size: 12px;
    }

    textarea {
      resize: vertical;
      min-height: 86px;
      line-height: 1.7;
    }

    input[type="range"] {
      accent-color: var(--gold-ink);
      width: 100%;
    }

    input[type="checkbox"] {
      accent-color: var(--gold-ink);
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    input[type="file"] {
      width: 100%;
      font-size: 11px;
      padding-block: 6px;
    }

    input::file-selector-button {
      background: var(--gold-soft);
      color: var(--gold-ink);
      border: 0;
      border-radius: 5px;
      padding: 8px 11px;
      margin-right: 12px;
      cursor: pointer;
    }

    .two-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .toggle-row small {
      display: block;
      margin-top: 4px;
      font-size: 10px;
    }

    .toggle-row:last-child {
      border: 0;
    }

    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .session-row strong {
      font-size: 12px;
      display: block;
    }

    .session-row div>span:not(.badge) {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin: 5px 0 8px;
    }

    .session-row:last-child {
      border: 0;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .table-scroll.panel {
      padding: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }

    th {
      background: var(--surface-soft);
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    th,
    td {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border: 0;
    }

    td:first-child {
      min-width: 140px;
    }

    .task-link {
      font-weight: 550;
    }

    .task-link:hover {
      color: var(--gold-ink);
    }

    .task-link small {
      display: block;
      font-weight: 400;
      margin-top: 5px;
      font-size: 10px;
    }

    .timeline {
      padding: 0;
      margin: 8px 0 0;
      list-style: none;
    }

    .timeline li {
      position: relative;
      padding: 0 0 22px 20px;
      border-left: 1px solid var(--line);
      margin-left: 4px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .timeline li:before {
      content: "";
      position: absolute;
      left: -4px;
      top: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    .timeline li:last-child {
      padding-bottom: 4px;
    }

    .timeline strong,
    .timeline span,
    .timeline small,
    .timeline a {
      display: block;
    }

    .timeline span {
      margin: 5px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .timeline a {
      color: var(--gold-ink);
      margin-top: 6px;
    }

    .notice {
      padding: 12px 14px;
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.7;
      margin: 15px 0;
    }

    .availability-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 40px;
    }

    .availability-grid h3 {
      margin-top: 0;
    }

    .status-explanation {
      border-top: 1px solid var(--line);
      margin-top: 22px;
      padding-top: 20px;
    }

    .status-explanation strong {
      font-size: 12px;
    }

    .status-explanation p {
      font-size: 11px;
      line-height: 1.9;
      margin-top: 10px;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .segmented button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 11px;
      min-height: 38px;
    }

    .segmented button[aria-pressed="true"] {
      color: var(--gold-ink);
      background: var(--gold-soft);
    }

    .segmented button:hover {
      background: var(--surface-soft);
    }

    .section-gap {
      margin-bottom: 22px;
    }

    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .inline-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .inline-controls input {
      max-width: 145px;
      font-size: 11px !important;
    }

    .inline-controls select {
      max-width: 122px;
    }

    .calendar-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 28px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      padding-bottom: 9px;
    }

    .calendar-day {
      min-width: 0;
      min-height: 74px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 8px 6px;
      color: #202830;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: color-mix(in srgb, var(--day-color) 22%, var(--surface));
    }

    .calendar-day.missing {
      background: var(--surface);
      outline: 1px dashed var(--line);
    }

    .calendar-day.selected {
      border-color: var(--gold-ink);
      outline: 1px solid var(--gold-ink);
      outline-offset: 1px;
    }

    .calendar-day strong {
      font-size: 12px;
    }

    .calendar-day span {
      font-size: 8px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .calendar-day small {
      font-size: 8px;
    }

    html[data-theme="dark"] .calendar-day {
      color: var(--ink);
    }

    .day-detail {
      padding-left: 25px;
      border-left: 1px solid var(--line);
    }

    .day-detail h3 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .day-detail>p {
      font-size: 12px;
      line-height: 1.8;
      margin-block: 16px;
    }

    .day-detail .data-list>div {
      font-size: 11px;
      grid-template-columns: 43% minmax(0, 1fr);
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .filter-row label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-row select {
      width: 180px;
    }

    .plain-list {
      padding-left: 18px;
      font-size: 11px;
      line-height: 1.9;
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    .plain-list li {
      padding: 6px 0;
    }

    .effort-form {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .effort-form .field {
      flex: 1;
      margin-bottom: 0;
    }

    .effort-form .button {
      min-height: 41px;
    }

    .request-form {
      max-width: 760px;
    }

    .request-header {
      width: 100%;
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
    }

    .request-header p {
      font-size: 11px;
      margin-top: 5px;
    }

    .request-detail {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 20px;
    }

    .request-detail>p {
      font-size: 12px;
      line-height: 1.8;
    }

    .request-detail .timeline {
      margin: 22px 0;
    }

    .notification-row {
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }

    .notification-row:last-child {
      border: 0;
    }

    .notification-row a {
      font-size: 13px;
      font-weight: 550;
    }

    .notification-row a:hover {
      color: var(--gold-ink);
    }

    .notification-row p {
      font-size: 11px;
      margin: 5px 0;
    }

    .notification-row.unread a:before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      margin: 0 8px 2px 0;
    }

    .checkbox-label {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .messages {
      margin-bottom: 24px;
    }

    .messages>div {
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .messages strong {
      font-size: 12px;
    }

    .messages small {
      margin-left: 14px;
    }

    .messages p {
      font-size: 12px;
      line-height: 1.9;
      margin-top: 7px;
    }

    .announcement {
      padding: 7px 0 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .announcement:last-child {
      border: 0;
      margin: 0;
    }

    .announcement h3 {
      font-size: 18px;
      margin: 16px 0 10px;
    }

    .announcement p {
      font-size: 12px;
      line-height: 1.9;
      max-width: 75ch;
    }

    .announcement small {
      display: block;
      margin-top: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .summary-grid>div {
      border-right: 1px solid var(--line);
      padding-right: 16px;
    }

    .summary-grid>div:last-child {
      border: 0;
    }

    .summary-grid span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .summary-grid strong {
      display: block;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 600;
    }

    .summary-grid strong.text-value {
      font-size: 16px;
    }

    .summary-grid small {
      display: block;
      margin-top: 8px;
      font-size: 9px;
    }

    .empty {
      padding: 30px 15px;
      font-size: 13px;
      text-align: center;
      background: var(--surface-soft);
      border-radius: 8px;
    }

    .error {
      color: var(--red);
      font-size: 12px;
      margin: 14px 0;
    }

    details {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    details:last-child {
      border: 0;
    }

    summary {
      font-size: 12px;
      font-weight: 550;
      cursor: pointer;
    }

    details p {
      font-size: 12px;
      margin-top: 12px;
      line-height: 1.9;
    }

    dialog {
      padding: 28px;
      border: 0;
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      width: calc(100% - 32px);
      max-width: 480px;
      max-height: calc(100dvh - 40px);
      overflow-x: hidden;
      overflow-y: auto;
      box-shadow: 0 20px 70px #0003;
    }

    dialog::backdrop {
      background: #202830a6;
      backdrop-filter: blur(3px);
    }

    .dialog-heading {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .dialog-heading h2 {
      font-size: 20px;
    }

    .dialog-heading .icon-button {
      margin-right: -7px;
    }

    dialog>p {
      font-size: 12px;
      line-height: 1.8;
    }

    .avatar-crop {
      width: 220px;
      height: 220px;
      margin: 24px auto;
      overflow: hidden;
      border-radius: 50%;
      background: var(--surface-soft);
    }

    .avatar-crop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--ink);
      color: var(--surface);
      border-radius: 10px;
      padding: 12px 15px;
      max-width: min(460px, calc(100vw - 32px));
      font-size: 12px;
      box-shadow: 0 8px 30px #0002;
    }

    html[data-theme="dark"] .toast {
      background: var(--gold);
      color: #202830;
    }

    .toast .icon-button {
      min-height: 28px;
      min-width: 28px;
    }

    .toast .icon-button:hover {
      background: #ffffff24;
    }

    @media (min-width: 1500px) {
      .two-columns {
        gap: 26px;
      }

      .panel {
        padding: 28px;

    /* Quiet motion: short compositor-only transitions, with no looping effects. */
    .prototype .profile-trigger,

    .prototype .profile-trigger:active,

      border: 1px solid var(--line);

      from {

.account-footer{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);margin-top:12px;padding:10px 2px 2px}
.account-footer-action{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:38px;padding:7px 5px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-size:11px;white-space:nowrap;cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
.account-footer-action:hover,.account-footer-action:focus-visible{background:var(--gold-soft);color:var(--ink)}
.account-footer-action svg{stroke-width:1.75}
@media(max-width:350px){.prototype .compact-account-menu{width:270px}.account-footer-action{gap:4px;font-size:10px}}

  <script type="text/plain" id="noto-sans-license"></script>
  <script type="text/plain" id="react-component-source">
import React, { useState, useEffect, useRef, createContext, useContext } from 'react';
import { createRoot } from 'react-dom/client';
import ITSystemAnalyst from '../iots-app/authentication-system/frontend/src/features/workspace/dashboards/ITSystemAnalyst.jsx';

// Single-file prototype source. Each named page can later become its own dashboard feature.

// -----------------------------------------------------------------------------
// Preview configuration and shared context
// -----------------------------------------------------------------------------
// Configuration and sample records are editable in the JSON sections above the runtime.
const config = JSON.parse(document.getElementById('workspace-config').textContent);
const previewData = JSON.parse(document.getElementById('workspace-sample-data').textContent);
const attendanceLabels = {
  present: 'Attendance recorded',
  holiday: 'Non-working day',
  absent: 'Confirmed absence',
  incomplete: 'Missing punch-out',
  missing: 'No record available',
  leave: 'Approved leave',
  future: 'Upcoming day',
};
function getInitials(name) {
  return name
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((part) => part[0])
    .join('')
    .toUpperCase();
}
const pages = {
  '/attendance': Attendance,
  '/tasks': Tasks,
  '/requests': Requests,
  '/requests/new': RequestForm,
  '/communication': Communication,
  '/performance': Performance,
  '/help': Help,
};
function resolvePage(path, route, employee, workMode) {
  if (profileSections.some((section) => section.path === path)) return <ProfilePage />;
  if (path === '/' || path === '/dashboard')
    return (
      <ITSystemAnalyst
        user={{
          ...employee,
          location: {
            status: workMode === 'Working Remotely' ? 'offsite' : 'onsite',
          },
        }}
      />
    );
  if (/^\/tasks\/[^/]+$/.test(path)) return <TaskDetails key={path} id={path.split('/')[2]} />;
  const Page = pages[path] || NotFound;
  return <Page key={route} />;
}
const Today = config.previewDate;
const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

// -----------------------------------------------------------------------------
// Shared UI components
// -----------------------------------------------------------------------------
function Icon({ name, size = 20 }) {
  const paths = {
    dashboard: (
      <>
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </>
    ),
    settings: (
      <>
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" fill="var(--surface)" />
        <circle cx="15" cy="17" r="3" fill="var(--surface)" />
      </>
    ),
    logout: (
      <>
        <path d="M9 4H5v16h4m6-12 4 4-4 4m-6-4h10" />
      </>
    ),
    moon: <path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z" />,
    user: (
      <>
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
      </>
    ),
    calendar: (
      <>
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M7 3v4m10-4v4M3 11h18m-12 5h2m4 0h2" />
      </>
    ),
    tasks: (
      <>
        <rect x="4" y="3" width="16" height="18" rx="2" />
        <path d="m7 9 2 2 3-4m2 3h3M7 16h10" />
      </>
    ),
    request: (
      <>
        <path d="M14 3H5v18h14V8Z" />
        <path d="M14 3v5h5m-7 4v6m-3-3h6" />
      </>
    ),
    bell: (
      <>
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-11 12h4" />
      </>
    ),
    chart: (
      <>
        <path d="M4 3v18h17M8 17v-4m5 4V9m5 8V5" />
      </>
    ),
    sun: (
      <>
        <circle cx="12" cy="12" r="4" />
        <path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2" />
      </>
    ),
    arrow: <path d="m9 5 7 7-7 7" />,
    check: <path d="m5 12 4 4L19 6" />,
    close: <path d="m6 6 12 12M6 18 18 6" />,
    help: (
      <>
        <circle cx="12" cy="12" r="9" />
        <path d="M9 8a3 3 0 0 1 6 0c0 3-3 2-3 5m0 3v1" />
      </>
    ),
    lock: (
      <>
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" />
      </>
    ),
    download: (
      <>
        <path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4" />
      </>
    ),
    menu: <path d="M4 6h16M4 12h16M4 18h16" />,
    clock: (
      <>
        <circle cx="12" cy="12" r="9" />
        <path d="M12 6v6l4 2" />
      </>
    ),
    edit: (
      <>
        <path d="m16 3 5 5-12 12H4v-5ZM14 5l5 5" />
      </>
    ),
  };
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="1.6"
      strokeLinecap="round"
      strokeLinejoin="round"
      aria-hidden="true"
    >
      {paths[name] || paths.tasks}
    </svg>
  );
}
function Button({ children, onClick, secondary = false, ...rest }) {
  return (
    <button {...rest} className={'button ' + (secondary ? 'secondary' : '')} onClick={onClick}>
      {children}
    </button>
  );
}
function Badge({ children, tone = '' }) {
  return <span className={'badge ' + tone}>{children}</span>;
}
function Link({ to, children, ...props }) {
  return (
    <a href={'#' + to} {...props}>
      {children}
    </a>
  );
}
function Header({ title, description, action }) {
  return (
    <div className="page-heading">
      <div>
        <Link className="back-link" to="/dashboard">
          Back to dashboard
        </Link>
        <h1 tabIndex="-1">{title}</h1>
      </div>
      {action}
    </div>
  );
}
function QuietNote({ children }) {
  return (
    <details className="quiet-note">
      <summary>Details</summary>
      <p>{children}</p>
    </details>
  );
}
function Panel({ title, description, children, action, className = '' }) {
  return (
    <section className={'panel ' + className}>
      <div className="section-heading">
        <h2>{title}</h2>
        {action}
      </div>
      {children}
    </section>
  );
}
function Dialog({ title, onClose, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const opener = document.activeElement;
    ref.current.showModal();
    return () => {
      ref.current?.close();
      opener?.isConnected && opener.focus();
    };
  }, []);
  return (
    <dialog
      ref={ref}
      onCancel={(e) => {
        e.preventDefault();
        onClose();
      }}
      aria-labelledby="dialog-heading"
      onKeyDown={(e) => {
        if (e.key !== 'Tab') return;
        const all = [
          ...ref.current.querySelectorAll('button,input,select,textarea,a[href]'),
        ].filter((el) => !el.disabled && el.getClientRects().length);
        if (!all.length) return;
        if (e.shiftKey && document.activeElement === all[0]) {
          e.preventDefault();
          all.at(-1).focus();
        } else if (!e.shiftKey && document.activeElement === all.at(-1)) {
          e.preventDefault();
          all[0].focus();
        }
      }}
    >
      <div className="dialog-heading">
        <h2 id="dialog-heading">{title}</h2>
        <button className="icon-button" aria-label="Close dialog" onClick={onClose}>
          <Icon name="close" />
        </button>
      </div>
      {children}
    </dialog>
  );
}
function Field({ label, children, hint }) {
  const id = React.useId();
  return (
    <div className="field">
      <label htmlFor={id}>{label}</label>
      {React.cloneElement(children, {
        id,
        'aria-describedby': hint ? id + '-hint' : undefined,
      })}
      {hint && <small id={id + '-hint'}>{hint}</small>}
    </div>
  );
}
function DataList({ items }) {
  return (
    <dl className="data-list">
      {items.map(([label, value]) => (
        <div key={label}>
          <dt>{label}</dt>
          <dd>{value}</dd>
        </div>
      ))}
    </dl>
  );
}
function Empty({ children }) {
  return <p className="empty">{children}</p>;
}

// -----------------------------------------------------------------------------
// Sample employee, task and request data
// -----------------------------------------------------------------------------
const initialEmployee = previewData.initialEmployee;
const initialTasks = previewData.initialTasks;
const initialRequests = previewData.initialRequests;

// -----------------------------------------------------------------------------
// Date helpers and preview attendance policy
// -----------------------------------------------------------------------------
function dateLabel(date, options = {}) {
  return new Date(date + 'T12:00:00').toLocaleDateString(config.locale, {
    day: 'numeric',
    month: 'short',
    ...options,
  });
}
function sampleDay(date) {
  const recorded = previewData.attendance[date];
  const weekday = new Date(date + 'T12:00:00Z').getUTCDay();
  const state =
    date > Today
      ? 'future'
      : recorded?.state || (!config.workingDays.includes(weekday) ? 'holiday' : 'missing');
  return {
    date,
    mode: 'Not recorded',
    punchIn: null,
    punchOut: null,
    breaks: null,
    hours: 'Not calculated',
    ...recorded,
    state,
    label: attendanceLabels[state],
  };
}

// -----------------------------------------------------------------------------
// Client-side routing
// -----------------------------------------------------------------------------
function useHashRoute() {
  const get = () => location.hash.slice(1) || '/dashboard';
  const [route, setRoute] = useState(get);
  useEffect(() => {
    const fn = () => setRoute(get());
    addEventListener('hashchange', fn);
    return () => removeEventListener('hashchange', fn);
  }, []);
  return route;
}

// -----------------------------------------------------------------------------
// Profile avatar and attendance summary
// -----------------------------------------------------------------------------
function Avatar({ large = false }) {
  const { avatar, employee } = useApp();
  return (
    <span className={'avatar ' + (large ? 'large' : '')}>
      {avatar ? (
        <img src={avatar} alt={employee.preferred + '’s profile avatar'} />
      ) : (
        getInitials(employee.name)
      )}
    </span>
  );
}
function Heatmap() {
  const cells = Array.from(
    {
      length: config.historyDays,
    },
    (_, i) => {
      const d = new Date(config.historyStart + 'T12:00:00');
      d.setDate(d.getDate() + i);
      return d.toISOString().slice(0, 10);
    },
  );
  return (
    <>
      <div className="heatmap-months">
        {Array.from(
          {
            length: 6,
          },
          (_, index) => {
            const day = new Date(Today + 'T12:00:00');
            day.setDate(1);
            day.setMonth(day.getMonth() - 5 + index);
            return (
              <span key={index}>
                {day.toLocaleDateString(config.locale, {
                  month: 'short',
                })}
              </span>
            );
          },
        )}
      </div>
      <div className="heatmap-wrap">
        <div className="week-labels">
          <span>Mon</span>
          <span>Wed</span>
          <span>Fri</span>
        </div>
        <div
          className="heatmap"
          aria-label="Sample attendance calendar, late April to October 2026"
        >
          {cells.map((date) => {
            const day = sampleDay(date);
            if (day.state === 'future')
              return <span key={date} className="day-cell future" title="Upcoming day" />;
            return (
              <Link
                key={date}
                to={'/attendance?date=' + date}
                className={'day-cell ' + day.state}
                aria-label={`${dateLabel(date, {
                  year: 'numeric',
                })}: ${day.label}. ${day.mode}. ${day.hours}. View day details.`}
                title={`${dateLabel(date)} · ${day.label} · ${day.hours}`}
              />
            );
          })}
        </div>
      </div>
      <div className="legend">
        {[
          ['present', 'Recorded'],
          ['leave', 'Leave'],
          ['holiday', 'Non-working'],
          ['absent', 'Absent'],
          ['incomplete', 'Incomplete'],
          ['missing', 'No data'],
        ].map(([c, t]) => (
          <span key={c}>
            <i className={c} />
            {t}
          </span>
        ))}
      </div>
      <QuietNote>
        Attendance states, not productivity scores. Location classification is shown in day details.
      </QuietNote>
    </>
  );
}
function AttendancePreview() {
  return (
    <Panel
      title="Attendance"
      action={
        <Link className="text-link" to="/attendance">
          View details <Icon name="arrow" size={14} />
        </Link>
      }
    >
      <Heatmap />
      <div className="today-row">
        <span>
          <Icon name="clock" />
          Today ·{' '}
          {dateLabel(Today, {
            month: 'long',
          })}
        </span>
        <span>
          Punch-in <strong>09:28</strong>
        </span>
        <span>
          Punch-out <strong>Pending</strong>
        </span>
        <Badge tone="green">On-site</Badge>
      </div>
    </Panel>
  );
}

// -----------------------------------------------------------------------------
// Profile views and account preferences
// -----------------------------------------------------------------------------
function AvatarEditor({ onClose }) {
  const { setAvatar, notify } = useApp();
  const [src, setSrc] = useState(''),
    [zoom, setZoom] = useState(1),
    [error, setError] = useState('');
  const image = useRef(null);
  function select(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (
      !['image/jpeg', 'image/png', 'image/webp'].includes(file.type) ||
      file.size > 2 * 1024 * 1024
    ) {
      setError('Choose a JPEG, PNG or WebP image under 2 MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setSrc(reader.result);
      setZoom(1);
      setError('');
    };
    reader.readAsDataURL(file);
  }
  function save() {
    const img = image.current;
    if (!img?.naturalWidth) {
      setError('Wait for the image preview to finish loading.');
      return;
    }
    const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    canvas
      .getContext('2d')
      .drawImage(
        img,
        (img.naturalWidth - side) / 2,
        (img.naturalHeight - side) / 2,
        side,
        side,
        0,
        0,
        256,
        256,
      );
    setAvatar(canvas.toDataURL('image/webp', 0.85));
    notify('Avatar updated in this preview.');
    onClose();
  }
  return (
    <Dialog title="Profile photo" onClose={onClose}>
      <p>Avatar only. Punch evidence remains separate.</p>
      <Field label="Choose an image" hint="JPEG, PNG or WebP · up to 2 MB">
        <input type="file" accept="image/jpeg,image/png,image/webp" onChange={select} />
      </Field>
      {src && (
        <>
          <div className="avatar-crop">
            <img
              ref={image}
              src={src}
              alt="Centred crop preview"
              style={{
                transform: `scale(${zoom})`,
              }}
              onError={() => {
                setSrc('');
                setError('This image could not be opened.');
              }}
            />
          </div>
          <Field label="Crop zoom">
            <input
              type="range"
              min="1"
              max="3"
              step=".1"
              value={zoom}
              onChange={(e) => setZoom(Number(e.target.value))}
            />
          </Field>
        </>
      )}
      {error && (
        <p role="alert" className="error">
          {error}

function ProfilePage() {
  const { route, employee, availability, workMode, availabilitySince, setModal } = useApp();
  const current = route.split('?')[0];
  const active = profileSections.find((section) => section.path === current) || profileSections[0];
  function select(section, focus = false) {
    location.hash = section.path;
    if (focus) document.getElementById('profile-tab-' + section.id)?.focus();
  }
  function navigate(event) {
    const directions = {
      ArrowRight: 1,
      ArrowLeft: -1,
    };
    let index = profileSections.indexOf(active);
    if (event.key in directions)
      index = (index + directions[event.key] + profileSections.length) % profileSections.length;
    else if (event.key === 'Home') index = 0;
    else if (event.key === 'End') index = profileSections.length - 1;
    else return;
    event.preventDefault();
    select(profileSections[index], true);
  }
  return (
    <>
      <Header
        title="Profile"
        action={
          <Button secondary onClick={() => setModal('edit-profile')}>
            <Icon name="edit" size={16} />

        </div>
      </section>
      <div className="profile-browser">
        <div
          className="profile-tab-strip"
          role="tablist"
          aria-label="Profile sections"
          onKeyDown={navigate}
        >
          {profileSections.map((section) => (
            <button
              key={section.id}
              id={'profile-tab-' + section.id}
              role="tab"
              type="button"
              aria-selected={active.id === section.id}
              aria-controls={'profile-panel-' + section.id}
              tabIndex={active.id === section.id ? 0 : -1}
              onClick={() => select(section)}
            >
              {section.label}
            </button>
          ))}
        </div>
        {profileSections.map(({ id, label, View }) => (
          <section
            key={id}
            id={'profile-panel-' + id}
            role="tabpanel"
            aria-labelledby={'profile-tab-' + id}
            hidden={active.id !== id}
            tabIndex={0}
            className="profile-tab-content"
          >
            <h2 className="profile-section-title">{label}</h2>
            <View />
          </section>
        ))}
      </div>
    </>
  );
}

function Attendance() {
  const { route } = useApp();
  const query = new URLSearchParams(route.split('?')[1]);
  const [selected, setSelected] = useState(query.get('date') || Today),
    [month, setMonth] = useState((query.get('date') || Today).slice(0, 7)),
    [filter, setFilter] = useState('attendance'),
    [view, setView] = useState('month');
  useEffect(() => {
    const d = query.get('date');
    if (d) {
      setSelected(d);
      setMonth(d.slice(0, 7));
    }
  }, [route]);
  const year = Number(month.slice(0, 4)),
    m = Number(month.slice(5, 7)),
    days = new Date(year, m, 0).getDate(),
    offset = (new Date(year, m - 1, 1).getDay() + 6) % 7;
  function shift(delta) {
    const d = new Date(year, m - 1 + delta, 1, 12);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  const day = sampleDay(selected);
  const cells = Array.from(
    {
      length: days,
    },
    (_, i) => `${month}-${String(i + 1).padStart(2, '0')}`,
  );
  const shown =
    view === 'week'
      ? Array.from(
          {
            length: 7,
          },
          (_, i) => {
            const d = new Date(selected + 'T12:00:00');
            d.setDate(d.getDate() + i - 3);
            return d.toISOString().slice(0, 10);
          },
        )
      : cells;
  return (
    <>
      <Header title="Attendance & availability" />
      <Panel title="Availability">
        <AvailabilityEditor />
        <details className="availability-history">
          <summary>Availability history</summary>

                  <th>Duration</th>
                  <th>Work arrangement</th>

              </thead>

                <tr>
                  <td>22 Oct ? 09:30?11:45</td>
                  <td>Available</td>
                  <td>2h 15m</td>
                  <td>On-site</td>
                </tr>
                <tr>
                  <td>22 Oct ? 11:45?12:30</td>
                  <td>In Meeting</td>
                  <td>45 min</td>
                  <td>On-site</td>
                </tr>
                <tr>
                  <td>22 Oct ? 14:00?15:30</td>
                  <td>Do Not Disturb</td>
                  <td>1h 30m</td>
                  <td>On-site</td>
                </tr>
              </tbody>
            </table>
          </div>
          <QuietNote>
            Illustrative status intervals, not total working hours. Offline presence and approved
            absence are tracked separately.
          </QuietNote>
        </details>
      </Panel>
      <Panel
        title="Attendance calendar"
        action={
          <Link className="text-link" to="/requests/new?type=Attendance%20correction">
            Correct a record
          </Link>
        }
      >
        <div className="calendar-controls">
          <div className="segmented">
            <button aria-pressed={filter === 'attendance'} onClick={() => setFilter('attendance')}>
              Attendance
            </button>
            <button aria-pressed={filter === 'work'} onClick={() => setFilter('work')}>
              Work activity
            </button>
          </div>
          <div className="inline-controls">
            <button className="icon-button" aria-label="Previous month" onClick={() => shift(-1)}>
              ‹
            </button>
            <label className="sr-only" htmlFor="calendar-month">
              Calendar month
            </label>
            <input
              id="calendar-month"
              type="month"
              value={month}
              onChange={(e) => e.target.value && setMonth(e.target.value)}
            />
            <button className="icon-button" aria-label="Next month" onClick={() => shift(1)}>
              ›

function TaskDetails({ id }) {
  const { tasks, setTasks, notify } = useApp();
  const task = tasks.find((t) => t.id === id);
  const [note, setNote] = useState(''),
    [minutes, setMinutes] = useState(''),
    [link, setLink] = useState(''),
    [error, setError] = useState('');
  if (!task) return <NotFound />;
  const update = (patch) =>
    setTasks((items) =>
      items.map((t) =>
        t.id === id
          ? {
              ...t,
              ...patch,
            }
          : t,
      ),
    );
  return (
    <>
      <Header
        title={task.title}
        action={
          <Link className="button secondary" to="/tasks">
            Back to tasks
          </Link>
        }
      />
      <div className="two-columns">
        <Panel title="Deliverable & progress">
          <p>{task.description}</p>
          <div className="inline-meta">
            <Badge>{task.state}</Badge>
            <Badge tone="amber">{task.priority} priority</Badge>
          </div>
          <Field label={`Reported progress · ${task.progress}%`}>
            <input
              type="range"
              min="0"
              max="100"
              value={task.progress}
              disabled={task.state === 'In review'}
              onChange={(e) =>
                update({
                  progress: Number(e.target.value),
                })
              }
            />
          </Field>
          <div className="actions">
            <Button
              secondary
              disabled={task.state !== 'To do'}
              onClick={() =>
                update({
                  state: 'In progress',
                })
              }
            >
              Start task
            </Button>
            <Button
              secondary
              onClick={() => {
                update({
                  blocked: !task.blocked,
                });
                notify(
                  task.blocked
                    ? 'Blocker cleared in this preview.'
                    : 'Blocker recorded; request guidance if needed.',
                );
              }}
            >
              {task.blocked ? 'Clear blocker' : 'Raise a blocker'}
            </Button>
            <Link className="text-link" to="/requests/new?type=Guidance">
              Request guidance
            </Link>
          </div>
        </Panel>
        <Panel title="Feedback & revision">
          <p>{task.feedback}</p>
          <QuietNote>
            Reviewer: {task.reviewer}. You cannot approve your own required evidence.
          </QuietNote>
          <Badge>
            {task.state === 'Changes requested' ? 'Revision needed' : 'Review follows submission'}
          </Badge>
        </Panel>
        <Panel title="Notes & effort">
          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!note.trim()) return;
              update({
                notes: [...task.notes, note.trim()],
              });
              setNote('');
            }}
          >
            <Field label="Work note">
              <textarea
                required
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="What changed, what did you learn?"
              />
            </Field>
            <Button secondary>Add note</Button>
          </form>
          <ul className="plain-list">
            {task.notes.map((n, i) => (
              <li key={i}>{n}</li>
            ))}
          </ul>
          <form
            className="effort-form"
            onSubmit={(e) => {
              e.preventDefault();
              const n = Number(minutes);
              if (n <= 0 || n > 1440) return;
              update({
                minutes: task.minutes + n,
              });
              setMinutes('');
              notify('Task effort recorded separately from attendance.');
            }}
          >
            <Field label="Effort to add (minutes)">
              <input
                type="number"
                required
                min="1"
                max="1440"
                value={minutes}
                onChange={(e) => setMinutes(e.target.value)}
              />
            </Field>
            <Button secondary>Record effort</Button>
          </form>
          <p className="effort-total">{task.minutes} minutes recorded</p>
          <QuietNote>Effort does not change task state.</QuietNote>
        </Panel>
        <Panel title="Evidence & submission">
          <Field
            label="Attach sample evidence"
            hint="Only the filename is retained in this preview."
          >
            <input
              type="file"
              onChange={(e) => {
                const f = e.target.files[0];
                if (f) {
                  update({
                    evidence: [...task.evidence, f.name],
                  });
                  setError('');
                }
              }}
            />
          </Field>
          <form
            onSubmit={(e) => {
              e.preventDefault();
              try {
                const url = new URL(link);
                if (url.protocol !== 'https:') throw Error();
                update({
                  evidence: [...task.evidence, url.href],
                });
                setLink('');
                setError('');
              } catch {
                setError('Enter a complete HTTPS evidence link.');
              }
            }}
          >
            <Field label="Or add an evidence reference">
              <input
                type="url"
                value={link}
                onChange={(e) => setLink(e.target.value)}
                placeholder="https://…"
                required
              />
            </Field>
            <Button secondary>Add reference</Button>
          </form>
          <ul className="plain-list">
            {task.evidence.map((f, i) => (
              <li key={i}>
                {f} <Badge>Submitted evidence</Badge>
              </li>
            ))}
          </ul>
          <QuietNote>
            Required: deliverable file or reference. Accepted evidence is determined by the
            reviewer.
          </QuietNote>
          {error && (
            <p role="alert" className="error">
              {error}
            </p>
          )}
          <Button
            disabled={task.state === 'In review'}
            onClick={() => {
              if (!task.evidence.length) {
                setError('Add the required deliverable evidence before submitting.');
                return;
              }
              update({
                state: 'In review',
              });
              setError('');
              notify('Submission recorded for reviewer assessment in this preview.');
            }}
          >
            {task.state === 'Changes requested'
              ? 'Revise & resubmit'
              : task.state === 'In review'
                ? 'Awaiting review'
                : 'Submit for review'}
          </Button>
        </Panel>
      </div>
    </>
  );
}

function RequestForm() {
  const { route, requests, setRequests, notify } = useApp();
  const q = new URLSearchParams(route.split('?')[1]),
    revision = requests.find((r) => r.id === q.get('revise'));
  const [type, setType] = useState(revision?.type || q.get('type') || 'Annual leave'),
    [from, setFrom] = useState(revision?.from || q.get('date') || Today),
    [to, setTo] = useState(revision?.to || q.get('date') || Today),
    [reason, setReason] = useState(revision?.reason || ''),
    [evidence, setEvidence] = useState(''),
    [linkedRecord, setLinkedRecord] = useState(revision?.linkedRecord || ''),
    [error, setError] = useState('');
  function submit(e) {
    e.preventDefault();
    if (to < from) {
      setError('End date must be on or after the start date.');
      return;
    }
    if (reason.trim().length < 10) {
      setError('Add at least 10 characters explaining the request.');
      return;
    }
    if (revision)
      setRequests((a) =>
        a.map((r) =>
          r.id === revision.id
            ? {
                ...r,
                reason,
                linkedRecord,
                evidence: evidence || r.evidence,
                state: 'Pending',
                decision: 'Resubmitted for authorised review.',
                history: [...r.history, 'Additional details submitted · preview'],
              }
            : r,
        ),
      );
    else
      setRequests((a) => [
        {
          id: 'REQ-' + Date.now().toString().slice(-6),
          type,
          from,
          to,
          reason,
          evidence,
          linkedRecord,
          state: 'Pending',
          reviewer:
            type === 'Profile change'
              ? 'Authorised account administrator'
              : type === 'Technical issue'
                ? 'IT service owner'
                : 'Assigned manager / authorised reviewer',
          decision: 'Awaiting review. Self-approval is not available.',
          history: ['Submitted by employee · preview'],
        },
        ...a,
      ]);
    notify('Request added to this preview. No message was sent.');
    location.hash = '/requests';
  }
  return (
    <>
      <Header
        title={revision ? 'Add details & resubmit' : 'New request'}
        action={
          <Link className="button secondary" to="/requests">
            Cancel
          </Link>
        }
      />
      <Panel title="Request details">
        <form onSubmit={submit} className="request-form">
          <div className="two-fields">
            <Field label="Request type">
              <select value={type} onChange={(e) => setType(e.target.value)}>
                {RequestTypes.map((t) => (
                  <option key={t}>{t}</option>
                ))}
              </select>
            </Field>
            <Field label="Linked record (optional)">
              <input
                value={linkedRecord}
                onChange={(e) => setLinkedRecord(e.target.value)}
                placeholder="Task, attendance date or request ID"
              />
            </Field>
            <Field label="From">
              <input type="date" required value={from} onChange={(e) => setFrom(e.target.value)} />
            </Field>
            <Field label="To">
              <input type="date" required value={to} onChange={(e) => setTo(e.target.value)} />
            </Field>
          </div>
          <Field label="Reason / additional details">
            <textarea
              required
              minLength="10"
              rows="5"
              value={reason}
              onChange={(e) => setReason(e.target.value)}
              placeholder="Include the dates, context and the outcome you need."
            />
          </Field>
          <Field label="Evidence (optional)" hint="Filename only; no file is uploaded.">
            <input type="file" onChange={(e) => setEvidence(e.target.files[0]?.name || '')} />
          </Field>
          {type === 'Attendance correction' && (
            <p className="notice">
              Include the actual arrival/departure time. Corrections retain the original record and
              the reviewer’s decision.
            </p>
          )}
          {error && (
            <p className="error" role="alert">
              {error}
            </p>
          )}
          <Button>Submit request</Button>
        </form>
      </Panel>
    </>
  );
}
