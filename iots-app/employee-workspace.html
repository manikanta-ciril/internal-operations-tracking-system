  };
  if (modal === 'avatar') return <AvatarEditor onClose={close} />;
  if (modal === 'edit-profile')
    return (
      <Dialog title="Edit profile" onClose={close}>
        <form
          onSubmit={(e) => {
            e.preventDefault();
            const data = new FormData(e.currentTarget);
            setEmployee((p) => ({
              ...p,
              preferred: data.get('preferred').trim(),
              phone: data.get('phone').trim(),
              personal: data.get('personal').trim() || 'Not provided',
            }));
            notify('Allowed profile fields updated in this preview.');
            close();
          }}
        >
          <Field label="Preferred name">
            <input name="preferred" required maxLength="60" defaultValue={employee.preferred} />
          </Field>
          <Field label="Work phone / extension">
            <input name="phone" type="tel" maxLength="40" defaultValue={employee.phone} />
          </Field>
          <Field
            label="Personal contact (optional)"
            hint="Restricted employee/authorised-administration field; not a public directory item."
          >
            <input
              name="personal"
              type="email"
              defaultValue={employee.personal === 'Not provided' ? '' : employee.personal}
            />
          </Field>
          <QuietNote>
            Official identity and organisation fields require a controlled change request.
          </QuietNote>
          <div className="actions">
            <Button secondary type="button" onClick={close}>
              Cancel
            </Button>
            <Button>Save preview changes</Button>
          </div>
        </form>
      </Dialog>
    );
  if (modal === 'password')
    return (
      <Dialog title="Change password" onClose={close}>
        <p>Preview validation only. Your actual password will not change.</p>
        <form
          onSubmit={(e) => {
            e.preventDefault();
            const f = new FormData(e.currentTarget);
            if (
              f.get('next').length < 12 ||
              f.get('next') !== f.get('confirm') ||
              f.get('current') === f.get('next')
            ) {
              setError(
                'Use at least 12 characters, match the confirmation and choose a different password.',
              );
              return;
            }
            notify('Preview validation passed. No real password was changed.');
            close();
          }}
        >
          <Field label="Current password">
            <input name="current" type="password" autoComplete="current-password" required />
          </Field>
          <Field label="New password">
            <input
              name="next"
              type="password"
              autoComplete="new-password"
              minLength="12"
              required
            />
          </Field>
          <Field label="Confirm new password">
            <input name="confirm" type="password" autoComplete="new-password" required />
          </Field>
          {error && (
            <p className="error" role="alert">
              {error}
            </p>
          )}
          <Button>Validate preview change</Button>
        </form>
      </Dialog>
    );
  if (modal.kind === 'end-session')
    return (
      <Dialog title="End this sample session?" onClose={close}>
        <p>
          {modal.session.device} · {modal.session.location}
        </p>
        <p>Session history is retained. This does not create a punch-out or change attendance.</p>
        <div className="actions">
          <Button secondary onClick={close}>
            Keep session
          </Button>
          <Button
            onClick={() => {
              setSessions((a) => a.filter((s) => s.id !== modal.session.id));
              notify('Sample session ended. Your real IOTS login is unchanged.');
              close();
            }}
          >
            End sample session
          </Button>
        </div>
      </Dialog>
    );
  return (
    <Dialog title="Attendance evidence references" onClose={close}>
      <DataList
        items={[
          ['Date', dateLabel(modal.date)],
          ['Punch-in reference', 'PHOTO-SAMPLE-IN-024'],
          ['Punch-out reference', 'PHOTO-SAMPLE-OUT-024'],
          ['Location result', sampleDay(modal.date).mode],
          ['Correction trail', 'Original values preserved; changes require review'],
        ]}
      />
      <QuietNote>
        Reference placeholders only. No employee photo or private evidence is embedded in this
        prototype.
      </QuietNote>
    </Dialog>
  );
}

// -----------------------------------------------------------------------------
// Header menus and dropdown interactions
// -----------------------------------------------------------------------------
function useDropdown() {
  const [open, setOpen] = useState(false);
  const root = useRef(null),
    trigger = useRef(null);
  useEffect(() => {
    if (!open) return;
    const outside = (e) => {
      if (!root.current?.contains(e.target)) setOpen(false);
    };
    const escape = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        setOpen(false);
        trigger.current?.focus();
      }
    };
    document.addEventListener('pointerdown', outside);
    document.addEventListener('keydown', escape);
    root.current?.querySelector('[role="menuitem"],select')?.focus();
    return () => {
      document.removeEventListener('pointerdown', outside);
      document.removeEventListener('keydown', escape);
    };
  }, [open]);
  return {
    open,
    setOpen,
    root,
    trigger,
  };
}

// Compact account navigation: destinations come from the shared navigation configuration.
const accountGroups = [
  { id: 'work', label: 'Workspace', paths: ['/attendance', '/tasks', '/requests', '/performance'] },
  {
    id: 'account',
    label: 'Account & settings',
    paths: ['/profile', '/profile/security', '/profile/preferences'],
  },
];
function ProfileMenu() {
  const currentPath = useHashRoute().split('?')[0];
  const { employee, notices, theme, setTheme, sessions, setModal } = useApp();
  const { open, setOpen, root, trigger } = useDropdown();
  const [expanded, setExpanded] = useState({});
  useEffect(() => {
    if (!open) setExpanded({});
  }, [open]);
  const unread = notices.filter((notice) => !notice.read).length;
  const destination = (path) => config.navigation.find((entry) => entry[0] === path);
  function link(path, label) {
    const entry = destination(path);
    if (!entry) return null;
    const [to, title, icon] = entry;
    return (
      <Link
        key={to}
        role="menuitem"
        aria-current={currentPath === to ? 'page' : undefined}
        to={to}
        onClick={() => setOpen(false)}
        className="account-menu-item"
      >
        <Icon name={icon} size={17} />
        <span>{label || title}</span>
        {to === '/communication' && unread > 0 && (
          <span className="menu-count" aria-label={unread + ' unread'}>
            {unread}
          </span>
        )}
      </Link>
    );
  }
  function keys(event) {
    const items = [...root.current.querySelectorAll('[role="menuitem"]')];
    let index = items.indexOf(document.activeElement);
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      index =
        event.key === 'Home'
          ? 0
          : event.key === 'End'
            ? items.length - 1
            : (index + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[index]?.focus();
    }
    const group = accountGroups.find(
      (group) => document.activeElement?.id === 'account-group-' + group.id,
    );
    if (group && ['ArrowRight', 'ArrowLeft'].includes(event.key)) {
      event.preventDefault();
      setExpanded((previous) => ({ ...previous, [group.id]: event.key === 'ArrowRight' }));
    }
  }
  return (
    <div
      className="profile-menu-root"
      ref={root}
      onBlur={(event) => {
        if (!event.currentTarget.contains(event.relatedTarget)) setOpen(false);
      }}
    >
      <button
        ref={trigger}
        className="profile-trigger"
        aria-label="Open profile menu"
        aria-haspopup="menu"
        aria-expanded={open}
        aria-controls="profile-menu"
        onClick={() => setOpen((value) => !value)}
      >
        <Avatar />
      </button>
      {open && (
        <div
          id="profile-menu"
          className="account-dropdown compact-account-menu"
          role="menu"
          aria-label="Account menu"
          onKeyDown={keys}
        >
          <div className="menu-identity" role="presentation">
            <Avatar />
            <div>
              <strong>{employee.name}</strong>
              <span>{employee.email}</span>
            </div>
          </div>
          <div className="account-primary" role="group" aria-label="Quick links">
            {link('/dashboard')}
            {link('/communication', 'Notifications')}
          </div>
          {accountGroups.map((group) => (
            <div className="account-group" key={group.id} role="group" aria-label={group.label}>
              <button
                id={'account-group-' + group.id}
                className="account-menu-item menu-action account-group-toggle"
                role="menuitem"
                aria-expanded={!!expanded[group.id]}
                aria-controls={'account-children-' + group.id}
                onClick={() =>
                  setExpanded((previous) => ({ ...previous, [group.id]: !previous[group.id] }))
                }
              >
                <span className={'group-chevron ' + (expanded[group.id] ? 'is-open' : '')}>
                  <Icon name="arrow" size={14} />
                </span>
                <span>{group.label}</span>
                {group.paths.includes(currentPath) && (
                  <span className="group-active-dot" aria-label="Contains current page" />
                )}
              </button>
              {expanded[group.id] && (
                <div
                  id={'account-children-' + group.id}
                  className="account-group-children"
                  role="group"
                  aria-label={group.label + ' pages'}
                >
                  {group.paths.map((path) => link(path))}
                </div>
              )}
            </div>
          ))}
          <div className="account-footer" role="group" aria-label="Help and account actions">
            <Link
              to="/help"
              role="menuitem"
              className="account-footer-action"
              onClick={() => setOpen(false)}
            >
              <Icon name="help" size={16} />
              <span>Help</span>
            </Link>
            <button
              role="menuitem"
              className="account-footer-action"
              aria-label={theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}
              onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
            >
              <Icon name={theme === 'light' ? 'moon' : 'sun'} size={16} />
              <span>Theme</span>
            </button>
            <button
              role="menuitem"
              className="account-footer-action"
              onClick={() => {
                trigger.current?.focus();
                setOpen(false);
                setModal({
                  kind: 'end-session',
                  session: sessions.find((session) => session.current) || {
                    id: 0,
                    device: 'This preview',
                    location: 'No active sample session',
                  },
                });
              }}
            >
              <Icon name="logout" size={16} />
              <span>Log out</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
function AvailabilityMenu() {
  const {
    availability,
    setAvailability,
    workMode,
    setWorkMode,
    availabilitySince,
    setAvailabilitySince,
    statusMessage,
    setStatusMessage,
    expectedReturn,
    setExpectedReturn,
    sessions,
    notify,
  } = useApp();
  const { open, setOpen, root, trigger } = useDropdown();
  return (
    <div
      className="availability-root"
      ref={root}
      onBlur={(e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) setOpen(false);
      }}
    >
      <button
        ref={trigger}
        className="availability-trigger"
        aria-label="Change availability"
        aria-expanded={open}
        aria-controls="availability-menu"
        onClick={() => setOpen((v) => !v)}
      >
        <span className="availability-dot" />
        {availability}
        <span className="status-divider" />
        {workMode === 'Working Remotely' ? 'Remote' : 'On-site'}
        <svg
          viewBox="0 0 16 16"
          width="12"
          height="12"
          fill="none"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path d="m4 6 4 4 4-4" />
        </svg>
      </button>
      {open && (
        <div
          className="availability-dropdown"
          id="availability-menu"
          role="dialog"
          aria-label="Availability"
        >
          <h2>Availability</h2>
          <Field label="Work status">
            <select
              value={availability}
              onChange={(e) => {
                setAvailability(e.target.value);
                setAvailabilitySince('Just updated');
              }}
            >
              {config.availability.map((x) => (
                <option key={x}>{x}</option>
              ))}
            </select>
          </Field>
          <Field label="Work location">
            <select value={workMode} onChange={(e) => setWorkMode(e.target.value)}>
              {config.workLocations.map((location) => (
                <option key={location}>{location}</option>
              ))}
            </select>
          </Field>
          <Field label="Status message">
            <input
              maxLength="100"
              value={statusMessage}
              onChange={(e) => setStatusMessage(e.target.value)}
              placeholder="Optional"
            />
          </Field>
          <Field label="Back at">
            <input
              type="time"
              value={expectedReturn}
              onChange={(e) => setExpectedReturn(e.target.value)}
            />
          </Field>
          <div className="presence-line">
            <span className="availability-dot" />
            {sessions.some((s) => s.current) ? 'Online' : 'Offline'}
            <small>{availabilitySince}</small>
          </div>
          <QuietNote>
            Work status and location are independent. Leave and absence follow attendance policy.
            This preview does not approve remote work.
          </QuietNote>
          <Button
            onClick={() => {
              notify('Status updated in this preview.');
              setOpen(false);
            }}
          >
            Done
          </Button>
        </div>
      )}
    </div>
  );
}

// -----------------------------------------------------------------------------
// Application state, route composition and shell
// -----------------------------------------------------------------------------
function WorkspaceApp() {
  const route = useHashRoute(),
    path = route.split('?')[0];
  const [theme, setTheme] = useState(() => {
      try {
        return localStorage.getItem(config.themeStorageKey) || 'light';
      } catch {
        return 'light';
      }
    }),
    [employee, setEmployee] = useState(initialEmployee),
    role = employee.primary,
    [avatar, setAvatar] = useState(''),
    [modal, setModal] = useState(null),
    [toast, setToast] = useState(''),
    [availability, setAvailability] = useState('Available'),
    [workMode, setWorkMode] = useState('On-site'),
    [statusMessage, setStatusMessage] = useState(''),
    [expectedReturn, setExpectedReturn] = useState('11:30'),
    [availabilitySince, setAvailabilitySince] = useState('since 09:28'),
    [tasks, setTasks] = useState(initialTasks),
    [requests, setRequests] = useState(initialRequests),
    [sessions, setSessions] = useState(previewData.sessions),
    [preferences, setPreferences] = useState(previewData.preferences),
    [notices, setNotices] = useState(previewData.notices);
  const notify = (message) => setToast(message);
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try {
      localStorage.setItem(config.themeStorageKey, theme);
    } catch {}
  }, [theme]);
  useEffect(() => {
    setModal(null);
    if (path.startsWith('/profile')) return;
    window.scrollTo(0, 0);
    const timer = setTimeout(
      () =>
        document.querySelector('#main h1')?.focus({
          preventScroll: true,
        }),
      20,
    );
    return () => clearTimeout(timer);
  }, [route]);
  useEffect(() => {
    if (!toast) return;
    const timer = setTimeout(() => setToast(''), config.toastDuration);
    return () => clearTimeout(timer);
  }, [toast]);
  const home = path === '/dashboard' || path === '/';
  let page = resolvePage(path, route, employee, workMode);
  return (
    <AppContext.Provider
      value={{
        route,
        theme,
        setTheme,
        employee,
        setEmployee,
        role,
        avatar,
        setAvatar,
        modal,
        setModal,
        notify,
        availability,
        setAvailability,
        workMode,
        setWorkMode,
        statusMessage,
        setStatusMessage,
        expectedReturn,
        setExpectedReturn,
        availabilitySince,
        setAvailabilitySince,
        tasks,
        setTasks,
        requests,
        setRequests,
        sessions,
        setSessions,
        preferences,
        setPreferences,
        notices,
        setNotices,
      }}
    >
      <a
        className="skip-link"
        href="#main"
        onClick={(e) => {
          e.preventDefault();
          document.getElementById('main').focus();
        }}
      >
        Skip to content
      </a>
      <div
        className={
          'prototype role-page ' +
          (theme === 'dark' ? 'dark ' : '') +
          (home ? 'home-page' : 'service-page')
        }
      >
        <div className="role-container">
          <header className="workspace-header">
            <Link to="/dashboard" className="workspace-brand" aria-label="IT Analyst dashboard">
              <img src={window.IOTS_LOGO} alt="CIRIL" />
              <span>Internal operations</span>
            </Link>
            <div className="employee-tools">
              <div className="employee-context">
                <span>{employee.preferred}</span>
                <AvailabilityMenu />
              </div>
              <button
                className="icon-button theme-button"
                aria-label={theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}
                onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
              >
                <Icon name="sun" size={18} />
              </button>
              <ProfileMenu />
            </div>
          </header>
          <main id="main" tabIndex="-1" key={path.startsWith('/profile') ? 'profile' : path}>
            {page}
          </main>
          <footer className="workspace-footer">
            <span>
              {home ? 'One team. A shared purpose.' : 'IT System Analyst'}{' '}
              <span className="sample-mark">&middot; Preview</span>
            </span>
            {home ? (
              <button
                className="role-logout"
                onClick={() =>
                  setModal({
                    kind: 'end-session',
                    session: sessions.find((s) => s.current) || {
                      id: 0,
                      device: 'This preview',
                      location: 'No active sample session',
                    },
                  })
                }
              >
                Log out
                <Icon name="arrow" size={15} />
              </button>
            ) : (
              <Link className="text-link" to="/dashboard">
                Dashboard <Icon name="arrow" size={14} />
              </Link>
            )}
          </footer>
        </div>
      </div>
      {toast && (
        <div className="toast" role="status">
          <Icon name="check" size={18} />
          <span>{toast}</span>
          <button
            className="icon-button"
            aria-label="Dismiss notification"
            onClick={() => setToast('')}
          >
            <Icon name="close" size={16} />
          </button>
        </div>
      )}
      <GlobalModal key={typeof modal === 'string' ? modal : modal?.kind || 'none'} />
    </AppContext.Provider>
  );
}

// -----------------------------------------------------------------------------
// Mount the preview
// -----------------------------------------------------------------------------
createRoot(document.getElementById('root')).render(<WorkspaceApp />);
</script>
