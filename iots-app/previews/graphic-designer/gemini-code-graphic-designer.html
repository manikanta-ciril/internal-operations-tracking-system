<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>CIRIL · Design Workspace</title>
    <style>
      /* GitHub Primer + shadcn/ui Design Tokens */
      :root {
        --bg-canvas: #f6f8fa;
        --bg-default: #ffffff;
        --bg-subtle: #f1f5f9;
        --bg-muted: #eaeef2;
        --fg-default: #1f2328;
        --fg-muted: #59636e;
        --fg-subtle: #6e7781;
        --border-default: #d0d7de;
        --border-muted: #d8dee4;
        --primary: #1f2328;
        --primary-fg: #ffffff;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --success: #1a7f37;
        --success-soft: #dafbe1;
        --warning: #9a6700;
        --warning-soft: #fff8c5;
        --danger: #cf222e;
        --danger-soft: #ffebe9;
        --done: #8250df;
        --done-soft: #fbefff;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --shadow-xs: 0 1px 2px rgba(31, 35, 40, 0.04);
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Noto Sans, Helvetica,
          Arial, sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
          monospace;
      }

      html.dark {
        --bg-canvas: #0d1117;
        --bg-default: #161b22;
        --bg-subtle: #1c2128;
        --bg-muted: #21262d;
        --fg-default: #e6edf3;
        --fg-muted: #8b949e;
        --fg-subtle: #6e7681;
        --border-default: #30363d;
        --border-muted: #21262d;
        --primary: #f0f6fc;
        --primary-fg: #0d1117;
        --accent: #58a6ff;
        --accent-soft: rgba(56, 139, 253, 0.15);
        --success: #3fb950;
        --success-soft: rgba(46, 160, 67, 0.15);
        --warning: #d29922;
        --warning-soft: rgba(187, 128, 9, 0.15);
        --danger: #f85149;
        --danger-soft: rgba(248, 81, 73, 0.15);
        --done: #bc8cff;
        --done-soft: rgba(163, 113, 247, 0.15);
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-sans);
        background: var(--bg-canvas);
        color: var(--fg-default);
        font-size: 13.5px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* App Shell */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      /* Left Sidebar (GitHub / Linear Minimalist Rail) */
      .sidebar {
        width: 232px;
        background: var(--bg-default);
        border-right: 1px solid var(--border-default);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 14px 12px;
        flex-shrink: 0;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px 14px;
        border-bottom: 1px solid var(--border-muted);
        margin-bottom: 12px;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        font-size: 14px;
        color: var(--fg-default);
        text-decoration: none;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--fg-default);
        color: var(--bg-default);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.5px;
      }

      .nav-section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--fg-subtle);
        padding: 10px 8px 4px;
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        transition:
          background 0.12s,
          color 0.12s;
      }

      .nav-btn:hover {
        background: var(--bg-subtle);
        color: var(--fg-default);
      }
      .nav-btn.active {
        background: var(--bg-subtle);
        color: var(--fg-default);
        font-weight: 600;
        position: relative;
      }
      .nav-btn.active::before {
        content: "";
        position: absolute;
        left: -6px;
        top: 6px;
        bottom: 6px;
        width: 3px;
        border-radius: 3px;
        background: var(--accent);
      }

      .nav-badge {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--bg-muted);
        color: var(--fg-muted);
      }

      /* Quick-Jump Task List in Sidebar */
      .quick-task-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 2px;
        overflow-y: auto;
        max-height: 240px;
      }

      .quick-task-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .quick-task-item:hover,
      .quick-task-item.active {
        background: var(--bg-subtle);
        color: var(--fg-default);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--border-muted);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
      }

      .avatar-circle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-default);
        flex-shrink: 0;
      }

      /* Main Content Area */
      .main-area {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* Compact Sticky Header */
      .topbar {
        height: 52px;
        background: var(--bg-default);
        border-bottom: 1px solid var(--border-default);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--fg-muted);
      }

      .breadcrumbs strong {
        color: var(--fg-default);
        font-weight: 600;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .page-container {
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 22px 24px 48px;
      }

      /* shadcn/ui Primitives */
      .card {
        background: var(--bg-default);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
      }

      .card-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--fg-default);
      }
      .card-desc {
        font-size: 12px;
        color: var(--fg-muted);
      }
      .card-body {
        padding: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        font-weight: 500;
        border: 1px solid var(--border-default);
        background: var(--bg-default);
        color: var(--fg-default);
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: var(--bg-subtle);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .btn-primary:hover:not(:disabled) {
        opacity: 0.92;
        background: var(--primary);
      }

      .btn-accent {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
      }
      .btn-accent:hover:not(:disabled) {
        opacity: 0.92;
        background: var(--accent);
      }

      .btn-ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--bg-subtle);
      }

      .btn-sm {
        height: 27px;
        padding: 0 8px;
        font-size: 11.5px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--border-default);
        background: var(--bg-default);
        color: var(--fg-default);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .input,
      .select {
        height: 32px;
      }
      .textarea {
        min-height: 76px;
        resize: vertical;
      }

      /* Semantic Badges (GitHub Primer Style) */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 500;
        border: 1px solid transparent;
        white-space: nowrap;
      }

      .badge-mono {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-default);
        color: var(--fg-muted);
      }

      .badge-progress {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge-review {
        background: var(--done-soft);
        color: var(--done);
      }
      .badge-changes {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .badge-blocked {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .badge-completed {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-assigned {
        background: var(--bg-subtle);
        color: var(--fg-muted);
        border-color: var(--border-default);
      }

      /* KPI Strip */
      .kpi-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }

      .kpi-box {
        background: var(--bg-default);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.12s;
        text-align: left;
      }

      .kpi-box:hover,
      .kpi-box.active {
        border-color: var(--accent);
      }
      .kpi-label {
        font-size: 11.5px;
        color: var(--fg-muted);
        font-weight: 500;
      }
      .kpi-num {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }

      /* Toolbar & Segmented Tabs */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .segmented {
        display: inline-flex;
        background: var(--bg-subtle);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 2px;
        gap: 2px;
      }

      .seg-btn {
        border: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 12px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .seg-btn.active {
        background: var(--bg-default);
        color: var(--fg-default);
        box-shadow: var(--shadow-xs);
      }

      /* GitHub Issue Table List View */
      .issue-list {
        background: var(--bg-default);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .issue-list-header {
        background: var(--bg-subtle);
        padding: 8px 14px;
        border-bottom: 1px solid var(--border-default);
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .issue-row {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border-muted);
        display: grid;
        grid-template-columns: minmax(240px, 2fr) 150px 120px 140px auto;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.1s;
      }

      .issue-row:last-child {
        border-bottom: none;
      }
      .issue-row:hover {
        background: var(--bg-subtle);
      }

      /* Bento Grid View */
      .bento-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .bento-card {
        background: var(--bg-default);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        transition:
          border-color 0.12s,
          transform 0.12s;
      }

      .bento-card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      /* Progress Bar */
      .progress-track {
        height: 5px;
        width: 100%;
        background: var(--bg-muted);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.2s ease;
      }

      /* GitHub PR / Issue 2-Column Split Task Detail */
      .task-split-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 20px;
        align-items: start;
      }

      .task-main-col {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .task-side-rail {
        position: sticky;
        top: 72px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .meta-row {
        padding: 10px 0;
        border-bottom: 1px solid var(--border-muted);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .meta-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .meta-label {
        font-size: 11.5px;
        color: var(--fg-muted);
        font-weight: 600;
      }

      /* File Upload Dropzone */
      .dropzone {
        border: 1.5px dashed var(--border-default);
        border-radius: var(--radius-md);
        background: var(--bg-canvas);
        padding: 14px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      .dropzone:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      /* Timeline Feed */
      .timeline-item {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-muted);
        font-size: 12.5px;
      }
      .timeline-item:last-child {
        border-bottom: none;
      }

      /* Toast */
      .toast-box {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: var(--fg-default);
        color: var(--bg-default);
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        font-weight: 500;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @media (max-width: 960px) {
        .kpi-strip {
          grid-template-columns: repeat(2, 1fr);
        }
        .bento-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .task-split-layout {
          grid-template-columns: 1fr;
        }
        .issue-row {
          grid-template-columns: 1fr auto;
        }
        .issue-row .hide-sm {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .sidebar {
          display: none;
        }
        .bento-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // =========================================================================
      // 1. STATE & DATA ENGINE (Compatible with `ciril-designer-preview-v1`)

      function formatISTDate(d = new Date()) {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(d);
      }

      function formatShortTime(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function isoAt(dateStr, timeStr) {
        return new Date(`${dateStr}T${timeStr}:00+05:30`).toISOString();
      }

      function createInitialState() {
        const now = new Date();

            {

      function loadAppState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createInitialState();
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.tasks)) return createInitialState();
          if (parsed.employee?.name === "Designer account") {
            parsed.employee.name = "Sai Deepthi";
          }
          return parsed;
        } catch {
          return createInitialState();
        }
      }

      function saveAppState(nextState) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
        } catch (e) {
          console.error(e);
        }
      }

      // =========================================================================
      // 2. UI RENDERING ENGINE (Reactive Vanilla + shadcn/ui + Primer Architecture)
      // =========================================================================
      let state = loadAppState();
      let ui = {
        view: "work", // "work" | "reviews" | "report" | "history"
        activeTaskId: null, // null or "DES-xxx"
        filter: "all", // "all" | "active" | "attention" | "assigned"
        search: "",
        sort: "priority", // "priority" | "due" | "title"
        layout: "list", // "list" (GitHub table) | "grid" (Bento cards)
        reportFilter: "all", // "all" | "active" | "completed" | "attention"
        reportDate: formatISTDate(new Date()),
        theme: localStorage.getItem("ciril-designer-theme") || "light",
        toastMsg: null,
        showDeadlineForm: false,
        showBlockerForm: false,
      };

      if (ui.theme === "dark") document.documentElement.classList.add("dark");

      function notify(msg) {
        ui.toastMsg = msg;
        render();
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          ui.toastMsg = null;
          render();
        }, 2800);
      }

      function getStatusBadgeClass(status) {
        switch (status) {
          case "In progress":
            return "badge-progress";
          case "In review":
            return "badge-review";
          case "Changes requested":
            return "badge-changes";
          case "Blocked":
            return "badge-blocked";
          case "Completed":
            return "badge-completed";
          default:
            return "badge-assigned";
        }
      }

      function getStatusDotColor(status) {
        switch (status) {
          case "In progress":
            return "var(--accent)";
          case "In review":
            return "var(--done)";
          case "Changes requested":
            return "var(--warning)";
          case "Blocked":
            return "var(--danger)";
          case "Completed":
            return "var(--success)";
          default:
            return "var(--fg-subtle)";
        }
      }

      function isTaskOverdue(task) {
        return task.status !== "Completed" && new Date(task.due) < new Date();
      }

      function needsAttention(task) {
        return (
          task.status === "Changes requested" ||
          task.status === "Blocked" ||
          isTaskOverdue(task)
        );
      }

      window.openTask = function (taskId) {

        ui.showBlockerForm = false;
        render();

      window.navigateView = function (viewName) {
        ui.view = viewName;
        ui.activeTaskId = null;
        ui.filter = "all";
        render();
        window.scrollTo(0, 0);

      window.toggleTheme = function () {
        ui.theme = ui.theme === "dark" ? "light" : "dark";
        document.documentElement.classList.toggle("dark", ui.theme === "dark");

        render();

      window.changeAvailability = function (val) {
        state.settings.availability = val;
        saveAppState(state);
        notify(`Availability set to ${val}`);
      };

      window.startOrResumeTask = function (taskId) {
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) return;
        const prev = t.status;
        t.status = "In progress";
        if (t.blocker) t.blocker.open = false;
        t.events.push({
          at: new Date().toISOString(),
          by: state.employee.name,
          action: "In progress",
          detail:
            prev === "Blocked"
              ? "Blocker resolved; resumed work."
              : "Started working on task.",
        });
        saveAppState(state);
        notify(`${t.id} is now In Progress`);
      };

      // Add Working Note + Update Progress % + Log Effort Minutes
      window.handleWorkUpdate = function (e, taskId) {
        e.preventDefault();
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) return;

        const noteEl = document.getElementById("workNoteInput");
        const progEl = document.getElementById("workProgressInput");
        const effortEl = document.getElementById("workEffortInput");

        const noteText = noteEl ? noteEl.value.trim() : "";
        const newProg = progEl ? Number(progEl.value) : t.progress;
        const addMins = effortEl ? Number(effortEl.value) : 0;

        if (!noteText && newProg === t.progress && addMins === 0) {
          notify("Enter a work note, progress change, or time logged.");
          return;
        }

        const nowIso = new Date().toISOString();
        const summaryParts = [];

        if (Number.isFinite(newProg) && newProg !== t.progress) {
          summaryParts.push(`Progress ${t.progress}% → ${newProg}%`);
          t.progress = Math.max(0, Math.min(100, newProg));
          if (t.status === "Assigned") t.status = "In progress";
        }

        if (Number.isFinite(addMins) && addMins > 0) {
          t.effortMinutes = (t.effortMinutes || 0) + addMins;
          summaryParts.push(`+${addMins}m logged`);
        }

        if (noteText) {
          t.notes.push({ at: nowIso, text: noteText });
          summaryParts.push(noteText);
        }

        t.events.push({
          at: nowIso,
          by: state.employee.name,
          action: "Work update",
          detail: summaryParts.join(" · "),
        });

        saveAppState(state);
        if (noteEl) noteEl.value = "";
        if (effortEl) effortEl.value = "0";
        notify(`Saved work update on ${t.id}`);
      };

      window.quickAddMinutes = function (mins) {
        const el = document.getElementById("workEffortInput");
        if (el) el.value = String(Number(el.value || 0) + mins);
      };

      // Upload Evidence / File Version (Either as Draft Evidence OR Submit for Review)
      window.handleEvidenceUpload = function (mode, taskId) {
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) return;

        const fileLinkEl = document.getElementById("evidenceFileLink");
        const fileNoteEl = document.getElementById("evidenceFileNote");

        const fileVal = fileLinkEl ? fileLinkEl.value.trim() : "";
        const noteVal = fileNoteEl ? fileNoteEl.value.trim() : "";

        if (!fileVal) {
          notify("Please select a file or paste a deliverable link first.");
          return;
        }

        const nowIso = new Date().toISOString();
        const nextVer = (t.versions?.length || 0) + 1;

        t.versions.push({
          number: nextVer,
          file: fileVal,
          note:
            noteVal ||
            (mode === "submit" ? "Submitted for review" : "Working evidence uploaded"),
          at: nowIso,
        });

        if (mode === "submit") {
          t.status = "In review";
          t.progress = 100;
          t.events.push({
            at: nowIso,
            by: state.employee.name,
            action: "In review",
            detail: `Submitted v${nextVer} (${fileVal}) for review. ${noteVal}`,
          });
          saveAppState(state);
          notify(`${t.id} v${nextVer} submitted for review!`);
        } else {
          if (t.status === "Assigned") t.status = "In progress";
          t.events.push({
            at: nowIso,
            by: state.employee.name,
            action: "Evidence attached",
            detail: `Uploaded v${nextVer} (${fileVal}). ${noteVal}`,
          });
          saveAppState(state);
          notify(`Evidence v${nextVer} attached to ${t.id}`);
        }
      };

      window.handleFilePicker = function (inputEl) {
        const file = inputEl.files && inputEl.files[0];
        if (!file) return;
        const linkInput = document.getElementById("evidenceFileLink");
        if (linkInput) linkInput.value = file.name;
      };

      // Raise Blocker
      window.submitBlocker = function (e, taskId) {
        e.preventDefault();
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) return;
        const reason = document.getElementById("blockerReasonInput")?.value.trim();
        const severity =
          document.getElementById("blockerSeverityInput")?.value || "Medium";
        if (!reason) {
          notify("Describe what is blocking your work.");
          return;
        }
        t.status = "Blocked";
        t.blocker = {
          id: `ISS-${t.id}`,
          reason,
          severity,
          owner: "Reporting manager",
          open: true,
        };
        t.events.push({
          at: new Date().toISOString(),
          by: state.employee.name,
          action: "Blocked",
          detail: `${severity} blocker: ${reason}`,
        });
        ui.showBlockerForm = false;
        saveAppState(state);
        notify(`Blocker raised on ${t.id}`);
      };

      // Request Deadline Extension
      window.submitDeadlineRequest = function (e, taskId) {
        e.preventDefault();
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) return;
        const dueVal = document.getElementById("reqDueInput")?.value;
        const reason = document.getElementById("reqReasonInput")?.value.trim();
        if (!dueVal || !reason) {
          notify("Select a requested date/time and provide a short reason.");
          return;
        }
        t.deadlineRequest = {
          requestedDue: new Date(dueVal).toISOString(),
          reason,
          status: "Awaiting manager decision",
          at: new Date().toISOString(),
        };
        t.events.push({
          at: new Date().toISOString(),
          by: state.employee.name,
          action: "Deadline request",
          detail: `Requested extension to ${formatShortTime(t.deadlineRequest.requestedDue)}: ${reason}`,
        });
        ui.showDeadlineForm = false;
        saveAppState(state);
        notify(`Extension requested for ${t.id}`);
      };

      // Daily Report Actions
      window.addExtraWorkItem = function () {
        const el = document.getElementById("extraWorkInput");
        const val = el ? el.value.trim() : "";
        if (!val) return;
        state.extraWork.push({ date: ui.reportDate, text: val });
        saveAppState(state);
        el.value = "";
        notify("Added unplanned work item");
      };

      window.removeExtraWorkItem = function (idx) {
        const dayItems = state.extraWork.filter((x) => x.date === ui.reportDate);
        const target = dayItems[idx];
        if (!target) return;
        const masterIdx = state.extraWork.indexOf(target);
        if (masterIdx > -1) state.extraWork.splice(masterIdx, 1);
        saveAppState(state);
        render();
      };

      window.saveDailyReportNotes = function (queueSnapshot = false) {
        const remEl = document.getElementById("dailyRemarksInput");
        if (remEl) {
          state.remarks[ui.reportDate] = remEl.value.trim();
        }
        if (queueSnapshot && !state.deliveries.some((d) => d.date === ui.reportDate)) {
          state.deliveries.push({
            date: ui.reportDate,
            at: new Date().toISOString(),
            status: "Submitted",
          });
        }
        saveAppState(state);
        notify(
          queueSnapshot
            ? "Daily report queued for Ipsheetha & Chairman!"
            : "Daily report notes saved.",
        );
      };

      window.exportReportCSV = function () {
        const d = ui.reportDate;
        const remarks = (state.remarks[d] || "").replace(/"/g, '""');
        const extra = state.extraWork
          .filter((x) => x.date === d)
          .map((x) => x.text)
          .join("; ")
          .replace(/"/g, '""');

        let csv =
          "\uFEFFTask ID,Title,Category,Status,Progress %,Effort (mins),Latest Evidence,Today Notes,Unplanned Work,Management Remarks\n";
        state.tasks.forEach((t) => {
          const latestFile = t.versions?.length
            ? t.versions[t.versions.length - 1].file
            : "None";
          const notesText = (t.notes || [])
            .map((n) => n.text)
            .join(" | ")
            .replace(/"/g, '""');
          csv += `"${t.id}","${t.title}","${t.category}","${t.status}","${t.progress || 0}","${t.effortMinutes || 0}","${latestFile}","${notesText}","${extra}","${remarks}"\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ciril-daily-report-${d}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify("Exported CSV report");
      };

                        </div>
                        <button type="submit" class="btn btn-primary">Save Note & Progress</button>

                    ${
                      task.notes?.length
                        ? `
                      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-muted);">

                          .map(

                            <span>📝 ${n.text}</span>
                            <span style="font-size:11px; color:var(--fg-subtle); white-space:nowrap;">${formatShortTime(n.at)}</span>
                          </div>
                        `,
                          )
                          .join("")}
                      </div>

                        : ""
                    }
                  </div>
                </div>
              `
                  : ""

              <!-- 3. Evidence & Deliverable Upload + Versions Card -->

                  <span class="badge-mono">${task.versions?.length || 0} version(s)</span>
                </div>
                <div class="card-body">
                  ${
                    task.status !== "Completed"

                      <label class="dropzone" style="display:block; margin-bottom: 10px;">
                        <input type="file" style="display:none;" accept=".pdf,.png,.jpg,.jpeg,.webp,.svg,.ai,.psd,.pptx,.zip,.mp4" onchange="handleFilePicker(this)" />
                        <div style="font-weight: 600; font-size: 13px; color: var(--fg-default);">
                          📎 Click to choose a deliverable file from your computer
                        </div>
                        <div style="font-size: 11.5px; color: var(--fg-muted); margin-top: 2px;">

                        </div>

                      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                        <div>
                          <label style="font-size: 11.5px; font-weight: 600; color: var(--fg-muted); display:block; margin-bottom:4px;">
                            File Name or Shared Link (Figma / Drive) *
                          </label>

                        </div>
                        <div>
                          <label style="font-size: 11.5px; font-weight: 600; color: var(--fg-muted); display:block; margin-bottom:4px;">
                            Version / Evidence Note

                          <input id="evidenceFileNote" class="input" placeholder="What changed in this version?" />

                      </div>

                      <div style="display: flex; justify-content: flex-end; gap: 8px;">
                        <button type="button" class="btn" onclick="handleEvidenceUpload('draft', '${task.id}')">
                          Upload Draft Evidence
                        </button>
                        <button type="button" class="btn btn-accent" onclick="handleEvidenceUpload('submit', '${task.id}')">
                          ✓ Upload & Submit for Review
                        </button>
                      </div>
                    </div>
                  `
                      : ""
                  }

                  <!-- Uploaded Versions Table -->
                  ${
                    task.versions?.length
                      ? `
                    <div style="border: 1px solid var(--border-default); border-radius: var(--radius-sm); overflow: hidden;">
                      ${[...task.versions]
                        .reverse()
                        .map(
                          (v) => `
                        <div style="padding: 9px 12px; border-bottom: 1px solid var(--border-muted); display:flex; align-items:center; justify-content:space-between; gap:10px; font-size: 12.5px;">
                          <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                            <span class="badge-mono">v${v.number}</span>
                            <strong style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${v.file}</strong>
                            <span style="color:var(--fg-muted);">— ${v.note}</span>
                          </div>
                          <span style="font-size:11px; color:var(--fg-subtle); white-space:nowrap;">${formatShortTime(v.at)}</span>
                        </div>
                      `,
                        )
                        .join("")}
                    </div>
                  `
                      : `
                    <div style="font-size: 12.5px; color: var(--fg-muted); text-align: center; padding: 12px;">
                      No evidence files attached yet. Upload a draft or final deliverable above.
                    </div>
                  `
                  }
                </div>
              </div>

              <!-- 4. Compact Activity & Audit Trail -->
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Activity & Stage History</span>
                  <span class="card-desc">${task.events?.length || 0} events</span>
                </div>
                <div class="card-body" style="padding-top: 8px; padding-bottom: 8px;">
                  ${[...(task.events || [])]
                    .reverse()
                    .map(
                      (ev) => `
                    <div class="timeline-item">
                      <span style="color: var(--fg-subtle); font-family: var(--font-mono); font-size: 11px; min-width: 110px;">
                        ${formatShortTime(ev.at)}
                      </span>
                      <div style="flex:1;">
                        <strong>${ev.action}</strong>
                        <span style="color: var(--fg-muted);"> by ${ev.by}</span>
                        ${ev.detail ? `<div style="color: var(--fg-muted); margin-top: 2px;">${ev.detail}</div>` : ""}
                      </div>
                    </div>
                  `,
                    )
                    .join("")}
                </div>
              </div>

            </div>

            <!-- RIGHT METADATA SIDEBAR (GitHub Issue/PR Style) -->
            <aside class="task-side-rail">
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Task Metadata</span>
                </div>
                <div class="card-body" style="padding-top: 6px; padding-bottom: 12px;">

                  <div class="meta-row">
                    <span class="meta-label">Lifecycle Stage</span>
                    <div style="display:flex; gap:4px; margin-top:4px;">
                      ${["Assigned", "Working", "Review", "Closed"]
                        .map(
                          (st, idx) => `
                        <span style="flex:1; text-align:center; font-size:10.5px; padding:3px 2px; border-radius:4px; font-weight:600; background:${idx === stepIdx ? "var(--accent-soft)" : idx < stepIdx ? "var(--success-soft)" : "var(--bg-subtle)"}; color:${idx === stepIdx ? "var(--accent)" : idx < stepIdx ? "var(--success)" : "var(--fg-subtle)"};">
                          ${st}
                        </span>
                      `,
                        )
                        .join("")}
                    </div>
                  </div>

                  <div class="meta-row">
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                      <span class="meta-label">Completion</span>
                      <strong style="font-variant-numeric: tabular-nums;">${task.progress || 0}%</strong>
                    </div>
                    <div class="progress-track" style="margin-top:4px;">
                      <div class="progress-fill" style="width:${task.progress || 0}%;"></div>
                    </div>
                  </div>

                  <div class="meta-row">
                    <span class="meta-label">Deadline</span>
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                      <strong style="font-size:12.5px; color:${overdue ? "var(--danger)" : "var(--fg-default)"};">
                        ${formatShortTime(task.due)}
                      </strong>
                      ${
                        task.status !== "Completed"
                          ? `
                        <button class="btn btn-sm btn-ghost" onclick="ui.showDeadlineForm = !ui.showDeadlineForm; render();" style="font-size:11px; height:22px; padding:0 6px;">
                          ${ui.showDeadlineForm ? "Close" : "Extend"}
                        </button>
                      `
                          : ""
                      }
                    </div>
                    ${
                      task.deadlineRequest
                        ? `
                      <span style="font-size:11px; color:var(--warning);">
                        Requested: ${formatShortTime(task.deadlineRequest.requestedDue)} (${task.deadlineRequest.status})
                      </span>
                    `
                        : ""
                    }
                    ${
                      ui.showDeadlineForm
                        ? `
                      <form onsubmit="submitDeadlineRequest(event, '${task.id}')" style="margin-top:8px; display:flex; flex-direction:column; gap:6px; background:var(--bg-subtle); padding:8px; border-radius:var(--radius-sm);">
                        <input id="reqDueInput" type="datetime-local" class="input" style="height:28px; font-size:11.5px;" required />
                        <input id="reqReasonInput" class="input" style="height:28px; font-size:11.5px;" placeholder="Reason for extension..." required />
                        <button type="submit" class="btn btn-sm btn-primary">Request Extension</button>
                      </form>
                    `
                        : ""
                    }
                  </div>

                  <div class="meta-row">
                    <span class="meta-label">Effort Logged</span>
                    <strong style="font-size:13px; font-variant-numeric: tabular-nums;">
                      ${Math.floor((task.effortMinutes || 0) / 60)}h ${(task.effortMinutes || 0) % 60}m
                    </strong>
                  </div>

                  <div class="meta-row">
                    <span class="meta-label">Review Chain</span>
                    <div style="font-size:12px; color:var(--fg-default); margin-top:2px;">
                      You → Creative reviewer → Reporting manager
                    </div>
                  </div>

                </div>
              </div>
            </aside>

          </div>
        </div>
      `;
      }

      function renderTasksWorkspaceView() {
        const allTasks = state.tasks;
        const viewTasks = allTasks.filter((t) => {
          if (ui.view === "reviews")
            return t.status === "In review" || t.status === "Changes requested";
          if (ui.view === "history") return t.status === "Completed";
          return t.status !== "Completed";
        });

        const filtered = viewTasks
          .filter((t) => {
            if (ui.filter === "active") return t.status === "In progress";
            if (ui.filter === "attention") return needsAttention(t);
            if (ui.filter === "assigned") return t.status === "Assigned";
            return true;
          })
          .filter((t) =>
            `${t.id} ${t.title} ${t.category}`
              .toLowerCase()
              .includes(ui.search.toLowerCase()),
          )
          .sort((a, b) => {
            if (ui.sort === "title") return a.title.localeCompare(b.title);
            if (ui.sort === "due") return new Date(a.due) - new Date(b.due);
            return (
              (needsAttention(b) ? 1 : 0) - (needsAttention(a) ? 1 : 0) ||
              new Date(a.due) - new Date(b.due)
            );
          });

        const countActive = allTasks.filter(
          (t) => t.status === "In progress" || t.status === "Assigned",
        ).length;
        const countAttention = allTasks.filter((t) => needsAttention(t)).length;
        const countReview = allTasks.filter((t) => t.status === "In review").length;
        const countCompleted = allTasks.filter((t) => t.status === "Completed").length;

        return `
        <div>
          <!-- Page Header -->
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;">
            <div>
              <h1 style="font-size: 20px; font-weight: 600; letter-spacing: -0.3px;">
                ${ui.view === "reviews" ? "Reviews & Feedback" : ui.view === "history" ? "Completed History" : "Design Tasks"}
              </h1>
              <p style="font-size: 12.5px; color: var(--fg-muted);">
                Click any task to add working notes, log time, or upload deliverable evidence.
              </p>
            </div>
            <button class="btn" onclick="navigateView('report')">
              📄 Open Daily Report →
            </button>
          </div>

          <!-- 4-Card KPI Summary Strip -->
          <div class="kpi-strip">
            <button class="kpi-box ${ui.view === "work" && ui.filter === "all" ? "active" : ""}" onclick="ui.view='work'; ui.filter='all'; render();">
              <div class="kpi-label">Active Queue</div>
              <div class="kpi-num">${countActive}</div>
            </button>
            <button class="kpi-box ${ui.filter === "attention" ? "active" : ""}" onclick="ui.view='work'; ui.filter='attention'; render();">
              <div class="kpi-label" style="color:var(--warning);">Needs Attention</div>
              <div class="kpi-num" style="color:var(--warning);">${countAttention}</div>
            </button>
            <button class="kpi-box ${ui.view === "reviews" ? "active" : ""}" onclick="ui.view='reviews'; ui.filter='all'; render();">
              <div class="kpi-label" style="color:var(--done);">In Review</div>
              <div class="kpi-num" style="color:var(--done);">${countReview}</div>
            </button>
            <button class="kpi-box ${ui.view === "history" ? "active" : ""}" onclick="ui.view='history'; ui.filter='all'; render();">
              <div class="kpi-label" style="color:var(--success);">Completed</div>
              <div class="kpi-num" style="color:var(--success);">${countCompleted}</div>
            </button>
          </div>

          <!-- Filter & Search Control Bar -->
          <div class="toolbar">
            <div class="segmented">
              <button class="seg-btn ${ui.filter === "all" ? "active" : ""}" onclick="ui.filter='all'; render();">
                All (${viewTasks.length})
              </button>
              ${
                ui.view === "work"
                  ? `
                <button class="seg-btn ${ui.filter === "active" ? "active" : ""}" onclick="ui.filter='active'; render();">
                  In Progress
                </button>
                <button class="seg-btn ${ui.filter === "attention" ? "active" : ""}" onclick="ui.filter='attention'; render();">
                  Needs Attention (${countAttention})
                </button>
                <button class="seg-btn ${ui.filter === "assigned" ? "active" : ""}" onclick="ui.filter='assigned'; render();">
                  Not Started
                </button>
              `
                  : ""
              }
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
              <input
                class="input"
                style="width: 220px;"
                placeholder="Filter by ID, title, category..."
                value="${ui.search}"
                oninput="ui.search = this.value; render();"
              />
              <select class="select" style="width: 140px;" onchange="ui.sort = this.value; render();">
                <option value="priority" ${ui.sort === "priority" ? "selected" : ""}>Sort: Priority</option>
                <option value="due" ${ui.sort === "due" ? "selected" : ""}>Sort: Due Date</option>
                <option value="title" ${ui.sort === "title" ? "selected" : ""}>Sort: Name</option>
              </select>
              <div class="segmented">
                <button class="seg-btn ${ui.layout === "list" ? "active" : ""}" onclick="ui.layout='list'; render();" title="GitHub Table View">☰ List</button>
                <button class="seg-btn ${ui.layout === "grid" ? "active" : ""}" onclick="ui.layout='grid'; render();" title="Bento Card View">⊞ Grid</button>
              </div>
            </div>
          </div>

          <!-- Task Collection: GitHub Table List OR Bento Grid -->
          ${
            filtered.length === 0
              ? `
            <div class="card" style="padding: 36px; text-align: center; color: var(--fg-muted);">
              No matching tasks in this filter.
            </div>
          `
              : ui.layout === "list"
                ? `
            <div class="issue-list">
              <div class="issue-list-header">
                <span>${filtered.length} task(s) shown</span>
                <span>Status · Progress · Evidence · Due</span>
              </div>
              ${filtered
                .map((t) => {
                  const overdue = isTaskOverdue(t);
                  const latestNote = t.notes?.length
                    ? t.notes[t.notes.length - 1].text
                    : null;
                  return `
                  <div class="issue-row" onclick="openTask('${t.id}')">
                    <div style="min-width:0;">
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span class="status-dot" style="background:${getStatusDotColor(t.status)};"></span>
                        <span class="badge-mono">${t.id}</span>
                        <strong style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.title}</strong>
                        ${t.priority === "High" ? `<span class="badge badge-changes" style="font-size:10.5px; padding:1px 6px;">High</span>` : ""}
                      </div>
                      <div style="font-size:12px; color:var(--fg-muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        ${t.category} ${latestNote ? `· 📝 "${latestNote}"` : t.returnNote ? `· ⚠️ "${t.returnNote}"` : `· ${t.brief}`}
                      </div>
                    </div>

                    <div class="hide-sm">
                      <span class="badge ${getStatusBadgeClass(t.status)}">${t.status}</span>
                    </div>

                    <div class="hide-sm">
                      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--fg-muted); margin-bottom:3px;">
                        <span>${t.progress || 0}%</span>
                        <span>${t.versions?.length || 0} file(s)</span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width:${t.progress || 0}%;"></div>
                      </div>
                    </div>

                    <div class="hide-sm" style="font-size:12px; color:${overdue ? "var(--danger)" : "var(--fg-muted)"};">
                      📅 ${formatShortTime(t.due)}
                    </div>

                    <div style="text-align:right;">
                      <span class="btn btn-sm">Open →</span>
                    </div>
                  </div>
                `;
                })
                .join("")}
            </div>
          `
                : `
            <div class="bento-grid">
              ${filtered
                .map((t) => {
                  const overdue = isTaskOverdue(t);
                  return `
                  <div class="bento-card" onclick="openTask('${t.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="badge-mono">${t.id}</span>
                      <span class="badge ${getStatusBadgeClass(t.status)}">${t.status}</span>
                    </div>
                    <div>
                      <strong style="font-size:14px; display:block;">${t.title}</strong>
                      <span style="font-size:11.5px; color:var(--fg-muted);">${t.category}</span>
                    </div>
                    <p style="font-size:12px; color:var(--fg-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                      ${t.returnNote || t.blocker?.reason || t.brief}
                    </p>
                    <div style="margin-top:auto;">
                      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--fg-muted); margin-bottom:4px;">
                        <span>Progress: <strong>${t.progress || 0}%</strong></span>
                        <span>📎 ${t.versions?.length || 0} · 📝 ${t.notes?.length || 0}</span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width:${t.progress || 0}%;"></div>
                      </div>
                      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid var(--border-muted); font-size:11.5px; color:${overdue ? "var(--danger)" : "var(--fg-muted)"};">
                        <span>Due ${formatShortTime(t.due)}</span>
                        <strong style="color:var(--fg-default);">Manage →</strong>
                      </div>
                    </div>
                  </div>
                `;
                })
                .join("")}
            </div>
          `
          }
        </div>
      `;
      }

      // Redesigned 2-Column Daily Report View (Replaces the old narrow paper view)
      function renderDailyReportView() {
        const d = ui.reportDate;
        const dayName = new Date(`${d}T12:00:00+05:30`).toLocaleDateString("en-IN", {
          timeZone: "Asia/Kolkata",
          weekday: "long",
        });
        const isSubmitted = state.deliveries.some((x) => x.date === d);
        const extraList = state.extraWork.filter((x) => x.date === d);
        const savedRemarks = state.remarks[d] || "";

        const tasks = state.tasks;
        const inProgOrRev = tasks.filter(
          (t) => t.status === "In progress" || t.status === "In review",
        );
        const completed = tasks.filter((t) => t.status === "Completed");
        const pendingOrBlocked = tasks.filter((t) =>
          ["Assigned", "Changes requested", "Blocked"].includes(t.status),
        );

        const shownTasks = tasks.filter((t) => {
          if (ui.reportFilter === "active")
            return t.status === "In progress" || t.status === "In review";
          if (ui.reportFilter === "completed") return t.status === "Completed";
          if (ui.reportFilter === "attention")
            return ["Assigned", "Changes requested", "Blocked"].includes(t.status);
          return true;
        });

        return `
        <div>
          <!-- Top Action Bar -->
          <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <h1 style="font-size: 20px; font-weight: 600; letter-spacing: -0.3px;">Daily Work Report</h1>
              <span class="badge ${isSubmitted ? "badge-completed" : "badge-changes"}">
                ${isSubmitted ? "✓ Queued for Management" : "● Draft"}
              </span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <input
                type="date"
                class="input"
                style="width: 145px;"
                value="${d}"
                onchange="ui.reportDate = this.value; render();"
              />
              <span class="badge-mono" style="padding: 5px 8px;">${dayName}</span>
              <button class="btn" onclick="exportReportCSV()">⬇ Export CSV</button>
            </div>
          </div>

          <!-- 4-Card KPI Strip (Eliminates "0 entries for this day" blocks) -->
          <div class="kpi-strip">
            <button class="kpi-box ${ui.reportFilter === "all" ? "active" : ""}" onclick="ui.reportFilter='all'; render();">
              <div class="kpi-label">Total Tracked Tasks</div>
              <div class="kpi-num">${tasks.length}</div>
            </button>
            <button class="kpi-box ${ui.reportFilter === "active" ? "active" : ""}" onclick="ui.reportFilter='active'; render();">
              <div class="kpi-label" style="color:var(--accent);">In Progress & Review</div>
              <div class="kpi-num" style="color:var(--accent);">${inProgOrRev.length}</div>
            </button>
            <button class="kpi-box ${ui.reportFilter === "completed" ? "active" : ""}" onclick="ui.reportFilter='completed'; render();">
              <div class="kpi-label" style="color:var(--success);">Completed</div>
              <div class="kpi-num" style="color:var(--success);">${completed.length}</div>
            </button>
            <button class="kpi-box ${ui.reportFilter === "attention" ? "active" : ""}" onclick="ui.reportFilter='attention'; render();">
              <div class="kpi-label" style="color:var(--warning);">Pending / Action Needed</div>
              <div class="kpi-num" style="color:var(--warning);">${pendingOrBlocked.length}</div>
            </button>
          </div>

          <!-- 2-Column Split Workspace -->
          <div class="task-split-layout" style="grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr);">

            <!-- Left Column: Unified Daily Task Activity & Proof Table -->
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">Daily Task Deliverable & Note Summary</div>
                  <div class="card-desc">Click any task row to add working notes or upload missing proof.</div>
                </div>
                <div class="segmented">
                  <button class="seg-btn ${ui.reportFilter === "all" ? "active" : ""}" onclick="ui.reportFilter='all'; render();">All</button>
                  <button class="seg-btn ${ui.reportFilter === "active" ? "active" : ""}" onclick="ui.reportFilter='active'; render();">Active</button>
                  <button class="seg-btn ${ui.reportFilter === "completed" ? "active" : ""}" onclick="ui.reportFilter='completed'; render();">Done</button>
                </div>
              </div>

              <div>
                ${shownTasks
                  .map((t) => {
                    const latestFile = t.versions?.length
                      ? t.versions[t.versions.length - 1].file
                      : null;
                    const latestNote = t.notes?.length
                      ? t.notes[t.notes.length - 1].text
                      : null;
                    return `
                    <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-muted); display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;" onclick="openTask('${t.id}')">
                      <div style="min-width:0;">
                        <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
                          <span class="badge-mono">${t.id}</span>
                          <strong style="font-size:13.5px;">${t.title}</strong>
                          <span class="badge ${getStatusBadgeClass(t.status)}">${t.status}</span>
                        </div>
                        <div style="font-size:12px; color:var(--fg-muted); margin-top:4px; display:flex; flex-wrap:wrap; gap:10px;">
                          <span>📁 ${t.category}</span>
                          <span>⏱ ${t.effortMinutes || 0}m logged</span>
                          ${latestFile ? `<span style="color:var(--accent);">📎 ${latestFile}</span>` : `<span style="color:var(--fg-subtle);">No file attached</span>`}
                        </div>
                        ${
                          latestNote
                            ? `
                          <div style="font-size:12px; color:var(--fg-default); background:var(--bg-subtle); padding:4px 8px; border-radius:4px; margin-top:6px;">
                            📝 Note: "${latestNote}"
                          </div>
                        `
                            : ""
                        }
                      </div>
                      <button class="btn btn-sm">Update →</button>
                    </div>
                  `;
                  })
                  .join("")}
              </div>
            </div>

            <!-- Right Column: Unplanned Work & Management Remarks -->
            <div class="task-side-rail">
              <div class="card">
                <div class="card-header">
                  <div>
                    <div class="card-title">End-of-Day Log & Remarks</div>
                    <div class="card-desc">Shared with ${WORKSPACE_CONFIG.reportAudience.join(" & ")}.</div>
                  </div>
                </div>
                <div class="card-body" style="display:flex; flex-direction:column; gap:14px;">

                  <!-- Unplanned Work -->
                  <div>
                    <label style="font-size:12px; font-weight:600; display:block; margin-bottom:4px;">
                      Unplanned / Ad-Hoc Work Today
                    </label>
                    <div style="display:flex; gap:6px;">
                      <input
                        id="extraWorkInput"
                        class="input"
                        placeholder="Add ad-hoc design task..."
                        onkeydown="if(event.key==='Enter'){event.preventDefault(); addExtraWorkItem();}"
                      />
                      <button type="button" class="btn" onclick="addExtraWorkItem()">+ Add</button>
                    </div>
                    ${
                      extraList.length
                        ? `
                      <div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">
                        ${extraList
                          .map(
                            (item, i) => `
                          <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-subtle); padding:5px 8px; border-radius:4px; font-size:12px;">
                            <span>• ${item.text}</span>
                            <button class="btn btn-sm btn-ghost" style="height:20px; padding:0 4px;" onclick="removeExtraWorkItem(${i})">✕</button>
                          </div>
                        `,
                          )
                          .join("")}
                      </div>
                    `
                        : ""
                    }
                  </div>

                  <!-- Single Clean Remarks Box -->
                  <div>
                    <label style="font-size:12px; font-weight:600; display:block; margin-bottom:4px;">
                      Remarks for Ipsheetha / Chairman
                    </label>
                    <textarea
                      id="dailyRemarksInput"
                      class="textarea"
                      placeholder="Anything Ipsheetha or Chairman should know?"
                    >${savedRemarks}</textarea>
                    <span style="font-size:11px; color:var(--fg-subtle); display:block; margin-top:4px;">
                      Task notes and uploaded file versions are included automatically.
                    </span>
                  </div>

                  <div style="display:flex; gap:8px;">
                    <button type="button" class="btn" style="flex:1;" onclick="saveDailyReportNotes(false)">
                      Save Draft Notes
                    </button>
                    <button type="button" class="btn btn-primary" style="flex:1;" onclick="saveDailyReportNotes(true)">
                      Submit Report
                    </button>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      `;
      }

      // =========================================================================
      // 5. MASTER SHELL RENDER
      // =========================================================================
      function render() {
        const root = document.getElementById("root");
        const activeTask = ui.activeTaskId
          ? state.tasks.find((t) => t.id === ui.activeTaskId)
          : null;

        const workCount = state.tasks.filter((t) => t.status !== "Completed").length;
        const revCount = state.tasks.filter(
          (t) => t.status === "In review" || t.status === "Changes requested",
        ).length;
        const histCount = state.tasks.filter((t) => t.status === "Completed").length;

        root.innerHTML = `
        <div class="app-shell">
          <!-- Left Sidebar -->
          <aside class="sidebar">
            <div class="brand-row">
              <a href="#work" class="brand-title" onclick="navigateView('work')">
                <span class="brand-mark">CR</span>
                <span>CIRIL · IOTS</span>
              </a>
              <span class="badge-mono">v2.0</span>
            </div>

            <div class="nav-section-label">Workspace</div>
            <nav class="nav-list">
              <button class="nav-btn ${!activeTask && ui.view === "work" ? "active" : ""}" onclick="navigateView('work')">
                <span>📋 Tasks</span>
                <span class="nav-badge">${workCount}</span>
              </button>
              <button class="nav-btn ${!activeTask && ui.view === "reviews" ? "active" : ""}" onclick="navigateView('reviews')">
                <span>🔍 Reviews</span>
                <span class="nav-badge">${revCount}</span>
              </button>
              <button class="nav-btn ${!activeTask && ui.view === "report" ? "active" : ""}" onclick="navigateView('report')">
                <span>📊 Daily Report</span>
              </button>
              <button class="nav-btn ${!activeTask && ui.view === "history" ? "active" : ""}" onclick="navigateView('history')">
                <span>✅ History</span>
                <span class="nav-badge">${histCount}</span>
              </button>
            </nav>

            <div class="nav-section-label" style="margin-top: 8px;">Quick-Jump Tasks</div>
            <div class="quick-task-list">
              ${state.tasks
                .map(
                  (t) => `
                <button class="quick-task-item ${ui.activeTaskId === t.id ? "active" : ""}" onclick="openTask('${t.id}')" title="${t.id} · ${t.title}">
                  <span class="status-dot" style="background:${getStatusDotColor(t.status)};"></span>
                  <span style="font-family:var(--font-mono); font-size:11px; color:var(--fg-subtle);">${t.id}</span>
                  <span style="overflow:hidden; text-overflow:ellipsis;">${t.title}</span>
                </button>
              `,
                )
                .join("")}
            </div>

            <div class="sidebar-footer">
              <div class="user-chip">
                <div class="avatar-circle">SD</div>
                <div style="min-width:0;">
                  <div style="font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    ${state.employee.name}
                  </div>
                  <div style="font-size:11px; color:var(--fg-muted);">${state.employee.role}</div>
                </div>
              </div>
            </div>
          </aside>

          <!-- Main Area -->
          <div class="main-area">
            <header class="topbar">
              <div class="breadcrumbs">
                <span>Design Workspace</span>
                <span>/</span>
                <strong>${activeTask ? activeTask.id : ui.view === "report" ? "Daily Report" : ui.view === "reviews" ? "Reviews" : ui.view === "history" ? "History" : "Tasks"}</strong>
              </div>

              <div class="topbar-right">
                <select class="select" style="width: 148px; height: 28px; font-size: 12px;" onchange="changeAvailability(this.value)">
                  ${AVAILABILITY_STATES.map(
                    (s) => `
                    <option value="${s}" ${state.settings.availability === s ? "selected" : ""}>● ${s}</option>
                  `,
                  ).join("")}
                </select>
                <button class="btn btn-sm" onclick="toggleTheme()">
                  ${ui.theme === "dark" ? "☀️ Light" : "🌙 Dark"}
                </button>
              </div>
            </header>

            <main class="page-container">
              ${activeTask ? renderTaskDetailView(activeTask) : ui.view === "report" ? renderDailyReportView() : renderTasksWorkspaceView()}
            </main>
          </div>
        </div>

        ${ui.toastMsg ? `<div class="toast-box">✓ ${ui.toastMsg}</div>` : ""}
      `;
      }

      render();
    </script>
  </body>
</html>
