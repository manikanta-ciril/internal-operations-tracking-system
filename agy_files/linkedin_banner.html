<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deva Manikanta Sala - LinkedIn Banner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Added html2canvas for exporting the banner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            display: flex;
            /* Updated layout to support button at the bottom */
            flex-direction: column;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Changed to auto so the button doesn't get clipped on smaller screens */
            overflow: auto;
            padding: 2rem;
        }

        /* Fixed LinkedIn dimensions */
        .banner-container {
            width: 1584px;
            height: 396px;
            position: relative;
            overflow: hidden;
            background-color: #020617;
            /* Slate 950 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            /* Ensure background is captured correctly by html2canvas */
            transform-origin: top left;
        }

        /* Tech Grid Background */
        .tech-grid {
            position: absolute;
            inset: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            z-index: 1;
        }

        .grid-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #020617 0%, #020617 25%, transparent 60%);
            z-index: 2;
            pointer-events: none;
        }

        /* Abstract Glowing Orbs */
        .glow-1 {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            top: -300px;
            right: -200px;
            border-radius: 50%;
            z-index: 1;
        }

        .glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            bottom: -300px;
            right: 20%;
            border-radius: 50%;
            z-index: 1;
        }

        /* Scanline effect */
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
            background-size: 100% 4px;
            z-index: 2;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="banner-capture" class="banner-container">
        <div class="tech-grid"></div>
        <div class="grid-fade"></div>
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="scanline"></div>

    <!-- Export Button -->
    <button id="export-btn"
        class="flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-lg transition-all duration-200 ease-in-out hover:-translate-y-1 font-sans">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Export as PNG
    </button>

    <!-- Script for HTML to PNG conversion -->
    <script>
        document.getElementById('export-btn').addEventListener('click', function () {
            const banner = document.getElementById('banner-capture');
            const btn = this;
            const originalContent = btn.innerHTML;

            // Visual feedback
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Exporting...
            `;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // Wait briefly to ensure dynamic CSS is painted
            setTimeout(() => {
                html2canvas(banner, {
                    scale: 2, // Scale up for better quality export
                    useCORS: true,
                    backgroundColor: '#020617', // Match the banner container background
                    logging: false,
                    onclone: function(clonedDoc) {
                        // Fix for webkit bg-clip-text dropping gradients in html2canvas
                        const textClip = clonedDoc.querySelectorAll('.bg-clip-text');
                        textClip.forEach(el => {
                            el.style.webkitBackgroundClip = 'text';
                            el.style.backgroundClip = 'text';
                        });
                    }
                }).then(canvas => {
                    // Convert to data URL
                    const imgData = canvas.toDataURL('image/png');
    
                    // Create a temporary download link
                    const link = document.createElement('a');
                    link.download = 'linkedin_banner.png';
                    link.href = imgData;
    
                    // Trigger download
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
    
                    // Restore button
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }).catch(err => {
                    console.error('Error exporting image:', err);
                    alert('An error occurred while exporting the image.');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                });
            }, 300);
        });
    </script>
