<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRIL - Google MD3 Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F0F4F8; font-family: 'Roboto', sans-serif; }
        h1, .gs { font-family: 'Google Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[28px] p-8 md:p-12 w-full max-w-[480px] shadow-[0_4px_24px_rgba(0,0,0,0.06)] flex flex-col items-center text-center">
        <!-- Minimal Corporate Icon -->
        <svg class="w-12 h-12 text-[#1a73e8] mb-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
        
        <h1 class="text-3xl gs font-normal text-[#1f1f1f] mb-2">Sign in</h1>
        <p class="text-[#444746] mb-8 text-sm md:text-base">Use your CIRIL Account</p>
        
        <form class="w-full space-y-6 text-left">
            <!-- Floating Label Input 1 -->
            <div class="relative">
                <input type="text" id="empId" class="peer w-full rounded-t-md border-b border-gray-400 bg-[#f1f3f4] px-4 pt-6 pb-2 text-base text-[#1f1f1f] focus:border-[#0b57d0] focus:border-b-2 focus:bg-[#e8f0fe] focus:outline-none transition-all" placeholder=" " required>
                <label for="empId" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-all peer-focus:top-3 peer-focus:text-xs peer-focus:text-[#0b57d0] peer-valid:top-3 peer-valid:text-xs text-base pointer-events-none">Employee ID</label>
            </div>
            
            <!-- Floating Label Input 2 -->
            <div class="relative">
                <input type="password" id="pass" class="peer w-full rounded-t-md border-b border-gray-400 bg-[#f1f3f4] px-4 pt-6 pb-2 text-base text-[#1f1f1f] focus:border-[#0b57d0] focus:border-b-2 focus:bg-[#e8f0fe] focus:outline-none transition-all" placeholder=" " required>
                <label for="pass" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-all peer-focus:top-3 peer-focus:text-xs peer-focus:text-[#0b57d0] peer-valid:top-3 peer-valid:text-xs text-base pointer-events-none">Password</label>
            </div>
            
            <!-- Actions -->
            <div class="flex items-center justify-between pt-6">
                <a href="#" class="text-[#0b57d0] text-sm font-medium hover:bg-[#f8fafd] px-3 py-2 rounded-full transition-colors">Forgot password?</a>
                <button type="button" class="gs bg-[#0b57d0] hover:bg-[#0842a0] text-white px-7 py-2.5 rounded-full font-medium transition-colors shadow-sm text-sm">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
