<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRIL - Split Screen SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen flex bg-white text-slate-900">
    
    <!-- Left: Branding / Visuals -->
    <div class="hidden lg:flex lg:w-1/2 bg-slate-900 relative overflow-hidden flex-col justify-between p-12 text-white">
        <!-- Abstract UI Graphic -->
        <div class="absolute inset-0 opacity-[0.15] bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSI+PC9yZWN0Pgo8L3N2Zz4=')]"></div>
        <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[50%] bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[40%] h-[40%] bg-gradient-to-tl from-blue-500 to-cyan-400 rounded-full blur-[100px] pointer-events-none opacity-50"></div>
        
        <div class="relative z-10 text-2xl font-bold tracking-tight flex items-center space-x-2">
            <div class="w-8 h-8 bg-white text-slate-900 flex items-center justify-center rounded-lg">C</div>
            <span>CIRIL</span>
        </div>
        
        <div class="relative z-10 max-w-md">
            <h2 class="text-4xl font-bold mb-4 leading-tight">Manage real estate operations with clarity.</h2>
            <p class="text-slate-400 text-lg">The internal command center for property tracking, broker networking, and streamlined sales flows.</p>
        </div>
    </div>
    
    <!-- Right: Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-slate-50 lg:bg-white">
        <div class="w-full max-w-md bg-white p-8 lg:p-0 rounded-2xl shadow-xl lg:shadow-none border border-slate-100 lg:border-none">
            
            <div class="lg:hidden w-10 h-10 bg-slate-900 text-white flex items-center justify-center rounded-xl mb-6 font-bold text-xl">C</div>
            
            <h1 class="text-3xl font-semibold mb-2">Welcome back</h1>
            <p class="text-slate-500 mb-8">Please enter your details to sign in.</p>
            
            <form class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Employee ID</label>
                    <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all shadow-sm" placeholder="Enter your ID">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all shadow-sm" placeholder="••••••••">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <label class="flex items-center text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" class="mr-2.5 w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"> 
                        Remember me
                    </label>
                    <a href="#" class="text-sm text-indigo-600 font-medium hover:underline">Forgot password?</a>
                </div>
                <button type="button" class="w-full mt-4 bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-slate-900/20 active:scale-[0.98]">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
