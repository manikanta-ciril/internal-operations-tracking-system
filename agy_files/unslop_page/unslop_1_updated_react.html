            left: 2px;

            height: 18px;

                animation-iteration-count: 1 !important;

        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // =========================================================================
        // WEBGL HARDWARE CAPABILITY CHECK (Skill Pattern: Fallback Strategy)
        // =========================================================================
        const checkWebGLSupport = () => {
            try {
                const canvas = document.createElement('canvas');
                return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
            } catch (e) {
                return false;
            }
        };

        // =========================================================================
        // PURE CLIENT-SIDE SYNTHETIC AUDIO (Success Login Chime Only - No UI toggle)
        // =========================================================================
        const playSuccessChime = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                // Uplifting harmonic major triad chord: C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
                const frequencies = [523.25, 659.25, 783.99, 1046.50];
                frequencies.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);

                    gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.07);
                    gain.gain.linearRampToValueAtTime(0.065, ctx.currentTime + idx * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.07 + 0.35);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.07);
                    osc.stop(ctx.currentTime + idx * 0.07 + 0.38);
                });
            } catch (err) {
                // Audio autoplay handled silently
            }
        };

        const playNodePing = (freq = 920) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
                osc.connect(gain);

        // Convert Lat/Lon to 3D Cartesian coordinates on sphere of radius R
        const latLonToVector3 = (lat, lon, radius) => {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            return new THREE.Vector3(x, y, z);
        };

                    powerPreference: 'high-performance'
                });
                renderer.setSize(width, height);
                // DPR Optimization: 1 on mobile to protect GPU, max 2 on desktop
                renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                // Deep Space Starfield Particles
                const starGeo = new THREE.BufferGeometry();
                const starCount = 1400;
                const starPositions = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount * 3; i += 3) {
                    starPositions[i] = (Math.random() - 0.5) * 80;
                    starPositions[i + 1] = (Math.random() - 0.5) * 80;
                    starPositions[i + 2] = -12 - Math.random() * 50;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.12,
                    transparent: true,
                    opacity: 0.75
                });
                const starField = new THREE.Points(starGeo, starMat);
                scene.add(starField);

                // Earth World Group positioned in center/center-right (matching sample_page.png & reference_ui.png)
                const worldGroup = new THREE.Group();
                const isDesktop = width >= 1024;
                worldGroup.position.set(isDesktop ? 1.4 : 0, isDesktop ? -0.1 : -0.35, 0);
                scene.add(worldGroup);

                // Sun Direction
                const sunPosition = new THREE.Vector3(6.0, 3.5, 5.0);

                // 2. Texture Loading (Solar System Scope Earth Textures)
                const textureLoader = new THREE.TextureLoader();

                const getTexture = (key, fallbackPath) => {
                    if (window.EARTH_TEXTURE_DATA && window.EARTH_TEXTURE_DATA[key]) {
                        const tex = textureLoader.load(window.EARTH_TEXTURE_DATA[key]);
                        tex.colorSpace = THREE.SRGBColorSpace;
                        return tex;
                    }
                    const tex = textureLoader.load(fallbackPath);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    return tex;
                };

                const dayTexture = getTexture('earthDay', './textures/planets/earth_day_4096.jpg');
                const nightTexture = getTexture('earthNight', './textures/planets/earth_night_4096.jpg');
                const bumpRoughnessCloudsTexture = getTexture('earthClouds', './textures/planets/earth_bump_roughness_clouds_4096.jpg');

                // 3. Globe Sphere Mesh & Three.js Journey Shaders
                const GLOBE_RADIUS = 3.25;
                const sphereGeometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);

                const globeShaderMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        uSunPosition: { value: sunPosition },
                        uAtmosphereDayColor: { value: new THREE.Color('#4db2ff') },      // Three.js Journey Day Color
                        uAtmosphereTwilightColor: { value: new THREE.Color('#bc490b') }, // Three.js Journey Twilight Color
                        uDayTexture: { value: dayTexture },
                        uNightTexture: { value: nightTexture },
                        uBumpRoughnessCloudsTexture: { value: bumpRoughnessCloudsTexture }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        varying vec3 vNormal;
                        varying vec3 vPosition;

                        void main() {
                            vUv = uv;
                            vec4 worldPos = modelMatrix * vec4(position, 1.0);
                            vPosition = worldPos.xyz;
                            vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                            gl_Position = projectionMatrix * viewMatrix * worldPos;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 uSunPosition;
                        uniform vec3 uAtmosphereDayColor;
                        uniform vec3 uAtmosphereTwilightColor;
                        uniform sampler2D uDayTexture;
                        uniform sampler2D uNightTexture;
                        uniform sampler2D uBumpRoughnessCloudsTexture;

                        varying vec2 vUv;
                        varying vec3 vNormal;
                        varying vec3 vPosition;

                        void main() {
                            vec3 normal = normalize(vNormal);
                            vec3 viewDir = normalize(vPosition - cameraPosition);
                            vec3 sunDir = normalize(uSunPosition);

                            // Fresnel calculation
                            float fresnel = 1.0 - abs(dot(viewDir, normal));
                            fresnel = pow(fresnel, 2.0);

                            // Sun orientation (day vs night side)
                            float sunOrientation = dot(normal, sunDir);

                            // Atmosphere color mix: twilight orange to day cyan
                            float sunStep = smoothstep(-0.25, 0.75, sunOrientation);
                            vec3 atmosphereColor = mix(uAtmosphereTwilightColor, uAtmosphereDayColor, sunStep);

                            // Sample textures
                            vec4 dayColor = texture2D(uDayTexture, vUv);
                            vec4 nightColor = texture2D(uNightTexture, vUv);
                            vec4 bumpRoughClouds = texture2D(uBumpRoughnessCloudsTexture, vUv);

                            // Clouds strength from .b channel
                            float cloudsStrength = smoothstep(0.2, 1.0, bumpRoughClouds.b);
                            vec3 colorWithClouds = mix(dayColor.rgb, vec3(1.0), cloudsStrength * 1.5);

                            // Specular sheen for water: green channel is roughness (oceans ~0 roughness)
                            float roughness = max(bumpRoughClouds.g, step(0.01, cloudsStrength));
                            vec3 reflectDir = reflect(-sunDir, normal);
                            float spec = pow(max(dot(-viewDir, reflectDir), 0.0), 24.0);
                            float specular = (1.0 - roughness) * spec * max(sunOrientation, 0.0);

                            // Day / Night transition
                            float dayStrength = smoothstep(-0.25, 0.5, sunOrientation);
                            vec3 finalOutput = mix(nightColor.rgb * 1.45, colorWithClouds + vec3(specular * 0.4), dayStrength);

                            // Atmosphere Fresnel rim glow
                            float atmosphereDayStrength = smoothstep(-0.5, 1.0, sunOrientation);
                            float atmosphereMix = clamp(atmosphereDayStrength * fresnel, 0.0, 1.0);
                            finalOutput = mix(finalOutput, atmosphereColor, atmosphereMix * 0.9);

                            gl_FragColor = vec4(finalOutput, 1.0);
                        }
                    `
                });

                const globeMesh = new THREE.Mesh(sphereGeometry, globeShaderMaterial);
                worldGroup.add(globeMesh);

                // 4. Outer Atmosphere Shell (side: THREE.BackSide, scale 1.04)
                const atmosphereMaterial = new THREE.ShaderMaterial({
                    side: THREE.BackSide,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    uniforms: {
                        uSunPosition: { value: sunPosition },
                        uAtmosphereDayColor: { value: new THREE.Color('#4db2ff') },
                        uAtmosphereTwilightColor: { value: new THREE.Color('#bc490b') }
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vPosition;

                        void main() {
                            vec4 worldPos = modelMatrix * vec4(position, 1.0);
                            vPosition = worldPos.xyz;
                            vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                            gl_Position = projectionMatrix * viewMatrix * worldPos;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 uSunPosition;
                        uniform vec3 uAtmosphereDayColor;
                        uniform vec3 uAtmosphereTwilightColor;
                        varying vec3 vNormal;
                        varying vec3 vPosition;

                        void main() {
                            vec3 normal = normalize(vNormal);
                            vec3 viewDir = normalize(vPosition - cameraPosition);
                            vec3 sunDir = normalize(uSunPosition);

                            float fresnel = 1.0 - abs(dot(viewDir, normal));
                            float alpha = clamp((1.0 - fresnel) / (1.0 - 0.73), 0.0, 1.0);
                            alpha = pow(alpha, 3.0);

                            float sunOrientation = dot(normal, sunDir);
                            alpha *= smoothstep(-0.5, 1.0, sunOrientation);

                            float sunStep = smoothstep(-0.25, 0.75, sunOrientation);
                            vec3 atmosphereColor = mix(uAtmosphereTwilightColor, uAtmosphereDayColor, sunStep);

                            gl_FragColor = vec4(atmosphereColor, alpha * 0.95);
                        }
                    `
                });

                const atmosphereMesh = new THREE.Mesh(sphereGeometry, atmosphereMaterial);
                atmosphereMesh.scale.setScalar(1.04);
                worldGroup.add(atmosphereMesh);

                // 5. Stationary Orientation (Calibrated for India - NO AUTO REVOLUTION)
                const DEFAULT_ROTATION = { x: 0.192, y: 3.07 };
                worldGroup.rotation.x = DEFAULT_ROTATION.x;
                worldGroup.rotation.y = DEFAULT_ROTATION.y;

                // 6. India Telemetry Network Directly on Earth Surface (17 States)
                const telemetryGroup = new THREE.Group();
                worldGroup.add(telemetryGroup);

                const stateVectors = {};
                const interactiveSpheres = [];
                const nodePulseList = [];
                const lineMeshList = [];

                STATE_HUBS.forEach((hub, hubIdx) => {
                    const vec = latLonToVector3(hub.lat, hub.lon, GLOBE_RADIUS);
                    stateVectors[hub.id] = vec;

                    // Normal vector pointing outwards from sphere center
                    const normal = vec.clone().normalize();

                    // Marker Root situated slightly above surface
                    const markerRoot = new THREE.Group();
                    markerRoot.position.copy(vec.clone().multiplyScalar(1.002));
                    markerRoot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

                    // 1. Center Core Mesh (flashes and scales on pulse)
                    const coreGeo = new THREE.CircleGeometry(0.024, 24);
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff3344, side: THREE.DoubleSide });
                    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                    markerRoot.add(coreMesh);

                    // 2. White Center Pupil Light
                    const pupilGeo = new THREE.CircleGeometry(0.010, 16);
                    const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
                    const pupilMesh = new THREE.Mesh(pupilGeo, pupilMat);
                    pupilMesh.position.z = 0.001;
                    markerRoot.add(pupilMesh);

                    // 3. Primary Sonar Shockwave Ring
                    const ring1Geo = new THREE.RingGeometry(0.026, 0.046, 32);
                    const ring1Mat = new THREE.MeshBasicMaterial({
                        color: 0xff3344,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85
                    });
                    const ring1Mesh = new THREE.Mesh(ring1Geo, ring1Mat);
                    ring1Mesh.position.z = 0.001;
                    markerRoot.add(ring1Mesh);

                    // 4. Secondary Echo Harmonic Ring
                    const ring2Geo = new THREE.RingGeometry(0.024, 0.038, 32);
                    const ring2Mat = new THREE.MeshBasicMaterial({
                        color: 0xff5566,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.6
                    });
                    const ring2Mesh = new THREE.Mesh(ring2Geo, ring2Mat);
                    ring2Mesh.position.z = 0.001;
                    markerRoot.add(ring2Mesh);

                    // 5. Elevated Sky Corona / Halo Ring
                    const haloGeo = new THREE.RingGeometry(0.018, 0.065, 32);
                    const haloMat = new THREE.MeshBasicMaterial({
                        color: 0x4db2ff,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.35
                    });
                    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
                    haloMesh.position.z = 0.002;
                    markerRoot.add(haloMesh);

                    // 6. 3D Vertical Atmospheric Uplink Laser Beam
                    const beamGeo = new THREE.CylinderGeometry(0.0012, 0.005, 0.15, 8);
                    beamGeo.rotateX(Math.PI / 2);
                    beamGeo.translate(0, 0, 0.075);
                    const beamMat = new THREE.MeshBasicMaterial({
                        color: 0xff3344,
                        transparent: true,
                        opacity: 0.75,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const beamMesh = new THREE.Mesh(beamGeo, beamMat);
                    markerRoot.add(beamMesh);

                    // Invisible Hit-Test Sphere for Raycasting
                    const hitGeo = new THREE.SphereGeometry(0.10, 12, 12);
                    const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitMesh = new THREE.Mesh(hitGeo, hitMat);
                    hitMesh.position.copy(vec);
                    hitMesh.userData = { hub, markerRoot, coreMesh, pupilMesh, ring1Mesh, ring2Mesh, haloMesh, beamMesh };
                    telemetryGroup.add(hitMesh);
                    interactiveSpheres.push(hitMesh);

                    telemetryGroup.add(markerRoot);

                    nodePulseList.push({
                        hub,
                        hubIdx,
                        markerRoot,
                        coreMesh,
                        pupilMesh,
                        ring1Mesh,
                        ring2Mesh,
                        haloMesh,
                        beamMesh,
                        randomOffset: (hubIdx * 0.37) % (Math.PI * 2)
                    });
                });

                // 7. Red Elevated Curved Communication Pathways & Animated Photons
                const arcCurves = [];
                const photonMeshes = [];

                NETWORK_CONNECTIONS.forEach(([fromId, toId], idx) => {
                    const v1 = stateVectors[fromId];
                    const v2 = stateVectors[toId];
                    if (!v1 || !v2) return;

                    const dist = v1.distanceTo(v2);
                    const mid = v1.clone().add(v2).multiplyScalar(0.5);
                    const elevation = dist * 0.16 + 0.035;
                    const controlPoint = mid.clone().normalize().multiplyScalar(GLOBE_RADIUS + elevation);

                    const curve = new THREE.QuadraticBezierCurve3(v1, controlPoint, v2);
                    arcCurves.push({ fromId, toId, curve });

                    const points = curve.getPoints(36);
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const lineMat = new THREE.LineBasicMaterial({
                        color: 0xff3344,
                        transparent: true,
                        opacity: 0.55,
                        linewidth: 1.5
                    });
                    const lineMesh = new THREE.Line(lineGeo, lineMat);
                    lineMesh.userData = { fromId, toId };
                    telemetryGroup.add(lineMesh);
                    lineMeshList.push(lineMesh);

                    // Flowing Glowing Data Photon Packet
                    const photonGeo = new THREE.SphereGeometry(0.016, 12, 12);
                    const photonMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const photon = new THREE.Mesh(photonGeo, photonMat);
                    photon.position.copy(v1);
                    telemetryGroup.add(photon);
                    photonMeshes.push({ mesh: photon, curve, t: (idx * 0.08) % 1.0, speed: 0.0035 + (idx % 3) * 0.001 });
                });

                // 8. Raycasting & Interactive Mouse Hover
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2(-999, -999);
                let currentHoveredHit = null;

                const onPointerMove = (e) => {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    // Check raycasting
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactiveSpheres);

                    if (intersects.length > 0) {
                        const hit = intersects[0].object;
                        if (currentHoveredHit !== hit) {
                            if (currentHoveredHit) {
                                currentHoveredHit.userData.markerRoot.scale.set(1, 1, 1);
                            }
                            currentHoveredHit = hit;
                            currentHoveredHit.userData.markerRoot.scale.set(1.4, 1.4, 1.4);
                            setHoveredNode(hit.userData.hub);

                            // Project 3D coordinate to 2D screen coordinate
                            const screenPos = hit.position.clone();
                            screenPos.applyMatrix4(worldGroup.matrixWorld);
                            screenPos.project(camera);
                            const x = ((screenPos.x + 1) * window.innerWidth) / 2;
                            const y = ((-screenPos.y + 1) * window.innerHeight) / 2;
                            setHudPos({ x, y });
                            document.body.style.cursor = 'pointer';
                        }
                    } else {
                        if (currentHoveredHit) {
                            currentHoveredHit.userData.markerRoot.scale.set(1, 1, 1);
                            currentHoveredHit = null;
                            setHoveredNode(null);
                            document.body.style.cursor = 'default';
                        }
                    }
                };

                const onCanvasClick = () => {
                    if (currentHoveredHit && onSelectState) {
                        playNodePing(1100);
                        onSelectState(currentHoveredHit.userData.hub);
                    }
                };

                // Gentle User Drag Interaction (Orbit Damping, settles without revolving away)
                let isDragging = false;
                let prevMouse = { x: 0, y: 0 };
                let targetRot = { ...DEFAULT_ROTATION };

                const onPointerDown = (e) => {
                    if (e.target.closest('button, input, a, form, .border-beam-card, .node-telemetry-hud')) return;
                    isDragging = true;
                    prevMouse = { x: e.clientX, y: e.clientY };
                };

                const onPointerUp = () => { isDragging = false; };

                const onDragMove = (e) => {
                    if (isDragging) {
                        const deltaX = (e.clientX - prevMouse.x) * 0.003;
                        const deltaY = (e.clientY - prevMouse.y) * 0.003;
                        targetRot.y += deltaX;
                        targetRot.x = Math.max(-0.4, Math.min(0.6, targetRot.x + deltaY));
                        prevMouse = { x: e.clientX, y: e.clientY };
                    }
                };

                window.addEventListener('pointerdown', onPointerDown, { passive: true });
                window.addEventListener('pointerup', onPointerUp, { passive: true });
                window.addEventListener('pointermove', onPointerMove, { passive: true });
                window.addEventListener('pointermove', onDragMove, { passive: true });
                window.addEventListener('click', onCanvasClick);

                // 9. Animation & Render Loop (Stationary India - NO auto-rotation!)
                let animId;
                let clock = new THREE.Clock();

                // Signal scene loaded
                if (onLoaded) {
                    setTimeout(onLoaded, 300);
                }

                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    const elapsedTime = clock.getElapsedTime();

                    // Smooth spring lerp back to India focus if dragged
                    worldGroup.rotation.x += (targetRot.x - worldGroup.rotation.x) * 0.06;
                    worldGroup.rotation.y += (targetRot.y - worldGroup.rotation.y) * 0.06;

                    // Organic Multi-Wave Point Bleep Animations
                    nodePulseList.forEach((node) => {
                        const isHovered = currentHoveredHit && currentHoveredHit.userData.hub.id === node.hub.id;
                        
                        // Natural concentric pulse cycle (1.6 Hz base frequency)
                        const cycle = (elapsedTime * (isHovered ? 3.4 : 1.6) + node.randomOffset) % 1.0;
                        const phase1 = cycle;
                        const phase2 = (cycle - 0.26 + 1.0) % 1.0;
                        const coreFlash = Math.max(0, 1.0 - cycle * (isHovered ? 3.0 : 4.0));

                        // Primary Expanding Shockwave Ring
                        const scale1 = 1.0 + Math.pow(phase1, 0.65) * (isHovered ? 3.6 : 2.8);
                        node.ring1Mesh.scale.set(scale1, scale1, 1);
                        node.ring1Mesh.material.opacity = Math.pow(Math.max(0, 1.0 - phase1), 1.2) * (isHovered ? 1.0 : 0.85);

                        // Secondary Echo Harmonic Ring
                        const scale2 = 1.0 + Math.pow(phase2, 0.7) * (isHovered ? 2.8 : 2.2);
                        node.ring2Mesh.scale.set(scale2, scale2, 1);
                        node.ring2Mesh.material.opacity = Math.pow(Math.max(0, 1.0 - phase2), 1.4) * (isHovered ? 0.75 : 0.5);

                        // Elevated Sky Corona Halo
                        const haloPulse = isHovered ? 0.8 : (0.25 + 0.15 * Math.sin(elapsedTime * 2.0));
                        node.haloMesh.material.opacity = haloPulse;
                        node.haloMesh.scale.set(1.0 + haloPulse * 0.3, 1.0 + haloPulse * 0.3, 1);

                        // Vertical Laser Spike
                        const beamScale = isHovered ? 2.2 : (0.7 + 0.4 * Math.sin(cycle * Math.PI));
                        node.beamMesh.scale.set(isHovered ? 1.5 : 1.0, isHovered ? 1.5 : 1.0, beamScale);
                        node.beamMesh.material.opacity = isHovered ? 0.95 : (0.45 + coreFlash * 0.45);

                        // Core Flash & White Center Pupil Flare
                        const coreScale = 1.0 + coreFlash * 0.45;
                        node.coreMesh.scale.set(coreScale, coreScale, 1);
                        node.pupilMesh.scale.set(1.0 + coreFlash * 0.8, 1.0 + coreFlash * 0.8, 1);

                        if (coreFlash > 0.4) {
                            node.coreMesh.material.color.setHex(0xff7788);
                            node.beamMesh.material.color.setHex(0xff7799);
                        } else {
                            node.coreMesh.material.color.setHex(0xff3344);
                            node.beamMesh.material.color.setHex(0xff3344);
                        }
                    });

                    // Highlight communication lines when hovering a node
                    if (currentHoveredHit) {
                        const hId = currentHoveredHit.userData.hub.id;
                        lineMeshList.forEach(line => {
                            if (line.userData.fromId === hId || line.userData.toId === hId) {
                                line.material.opacity = 0.95;
                                line.material.color.setHex(0xff4455);
                            } else {
                                line.material.opacity = 0.20;
                                line.material.color.setHex(0x992233);
                            }
                        });
                    } else {
                        lineMeshList.forEach(line => {
                            line.material.opacity = 0.55;
                            line.material.color.setHex(0xff3344);
                        });
                    }

                    // Animate flowing data photon packets along curves (with acceleration on hovered node)
                    photonMeshes.forEach(pkt => {
                        let speed = pkt.speed;
                        if (currentHoveredHit) {
                            const hId = currentHoveredHit.userData.hub.id;
                            if (pkt.curve.fromId === hId || pkt.curve.toId === hId) {
                                speed *= 2.6; // Stream data 2.6x faster on active lines
                            }
                        }
                        pkt.t = (pkt.t + speed) % 1.0;
                        pkt.mesh.position.copy(pkt.curve.getPoint(pkt.t));
                    });

                    renderer.render(scene, camera);
                };
                animate();

                // Window Resize Handler
                const onResize = () => {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);

                    const desktop = width >= 1024;
                    worldGroup.position.set(desktop ? 1.4 : 0, desktop ? -0.1 : -0.35, 0);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('pointerdown', onPointerDown);
                    window.removeEventListener('pointerup', onPointerUp);
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointermove', onDragMove);
                    window.removeEventListener('click', onCanvasClick);
                    window.removeEventListener('resize', onResize);
                    renderer.dispose();
                    if (renderer.domElement && container.contains(renderer.domElement)) {
                        container.removeChild(renderer.domElement);
                    }
                };
            }, [isDark, onSelectState, onLoaded]);

            if (!webGLSupported) {
                return (
                    <div className="fixed inset-0 z-0 bg-slate-950 flex items-center justify-center p-6 text-center">
                        <div className="max-w-md p-6 rounded-3xl bg-slate-900/90 border border-cyan-500/30 text-white backdrop-blur-xl">
                            <GlobeIcon className="w-10 h-10 text-cyan-400 mx-auto mb-3" />
                            <h3 className="text-base font-bold">Standard Visual Mode Active</h3>
                            <p className="text-xs text-slate-400 mt-2">
                                WebGL hardware acceleration is not active on this browser session. The portal remains fully functional with all enterprise security controls.
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <>
                    <div id="three-canvas" ref={mountRef} />
                    {hoveredNode && (
                        <div
                            className="node-telemetry-hud px-3.5 py-2.5 rounded-xl bg-slate-950/95 text-white border border-red-500/60 shadow-[0_8px_30px_rgba(255,51,68,0.45)] animate-fade-in text-left min-w-[210px]"
                            style={{ left: `${hudPos.x}px`, top: `${hudPos.y}px` }}
                        >
                            <div className="flex items-center space-x-1.5 text-xs font-bold text-red-400">
                                <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                                <span>{hoveredNode.name} Central Hub</span>
                            </div>
                            <div className="text-[11px] text-slate-300 font-medium mt-0.5">{hoveredNode.hub}</div>
                            <div className="text-[10px] font-mono text-cyan-300 mt-1 flex items-center justify-between">
                                <span>{hoveredNode.traffic} Traffic</span>
                                <span className="text-emerald-400 font-bold">● 100% Synced</span>
                            </div>
                            <div className="mt-1 pt-1 border-t border-slate-800 text-[9px] font-mono text-slate-400 flex items-center justify-between">
                                <span>Lat: {hoveredNode.lat.toFixed(2)}°N</span>
                                <span>Lon: {hoveredNode.lon.toFixed(2)}°E</span>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // =========================================================================
        // TYPEWRITER ANIMATION FOR SYSTEM NAME (Left Overlay)
        // =========================================================================
        const TypewriterHeader = ({ fullText = "Work Management Portal" }) => {
            const [displayedText, setDisplayedText] = useState("");
            const [isDone, setIsDone] = useState(false);

            useEffect(() => {
                let index = 0;
                setDisplayedText("");
                setIsDone(false);

                const interval = setInterval(() => {
                    if (index < fullText.length) {
                        setDisplayedText(fullText.substring(0, index + 1));
                        index++;
                    } else {
                        setIsDone(true);
                        clearInterval(interval);
                    }
                }, 50);

                return () => clearInterval(interval);
            }, [fullText]);

            return (
                <div className="text-left max-w-lg mb-6">
                    {/* Live Status Chip */}
                    <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-900/80 border border-cyan-500/30 text-cyan-300 text-[11px] font-mono uppercase tracking-widest mb-3 font-semibold backdrop-blur-md shadow-md">

                        targets: btnRef.current,
                        scale: 1.018,
                        duration: 250,
                        easing: 'easeOutCubic'

                            targets: arrowRef.current,
                            translateX: 4,
                            duration: 200,

                                </div>
                                <div className="flex-1 text-left">
                                    <div className="text-xs font-bold">{toast.title}</div>
                                    <div className="text-[11px] text-slate-300 mt-0.5 leading-snug">{toast.description}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* ========================================================= */}
                    {/* SIMPLIFIED ACCESSIBILITY / HELPDESK MODALS                */}
                    {/* ========================================================= */}
                    {activeModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md animate-fade-in">
                            <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-slate-700 text-white p-6 shadow-2xl animate-slide-up text-left">
                                <button
                                    type="button"
                                    onClick={() => setActiveModal(null)}
                                    className="absolute right-4 top-4 p-2 text-slate-400 hover:text-white rounded-full bg-slate-800/60 transition-colors"
                                >
                                    <XIcon className="w-4 h-4" />
                                </button>

                                {activeModal === 'helpdesk' && (
                                    <div className="space-y-4">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-10 h-10 rounded-2xl bg-cyan-950 border border-cyan-800 flex items-center justify-center text-cyan-400">
                                                <ShieldIcon className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <h3 className="text-base font-bold">Credential Recovery</h3>
                                                <p className="text-xs text-slate-400">IT Support & Workspace Provisioning</p>
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            For security policy reasons, password resets are processed through your company active directory administrator. Contact your regional coordinator or submit a service ticket.
                                        </p>
                                        <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-cyan-300 flex items-center justify-between">
                                            <span>Support Hotline:</span>
                                            <span>it-support@ciril.internal</span>
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'privacy' && (
                                    <div className="space-y-4">
                                        <h3 className="text-base font-bold">Privacy Architecture</h3>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            Operations tracking data and real estate portfolio telemetry are strictly partitioned. Session authentications utilize salted token cryptography with automatic session expiry.
                                        </p>
                                        <div className="text-[11px] text-slate-400 font-mono">
                                            Compliance ID: ISO-27001-OPS-2026
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'security' && (
                                    <div className="space-y-4">
                                        <h3 className="text-base font-bold">Security Protocols</h3>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            All network transmission arcs between state operational hubs operate via encrypted peer-to-peer data pathways with TLS 1.3 verification and redundant failover routing.
                                        </p>
                                        <div className="text-[11px] text-slate-400 font-mono">
                                            Telemetry Network: 17 Hubs Connected
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'validation' && (
                                    <div className="space-y-4">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-10 h-10 rounded-2xl bg-amber-950 border border-amber-800 flex items-center justify-center text-amber-400">
                                                <AlertCircleIcon className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <h3 className="text-base font-bold">Incomplete Information</h3>
                                                <p className="text-xs text-slate-400">Required credentials missing</p>
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            Please provide both your Employee ID and password to access the Work Management Portal. You can use the "Autofill Demo" button for quick verification.
                                        </p>
                                    </div>
                                )}

                                <div className="pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setActiveModal(null)}
                                        className="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold transition-colors cursor-pointer"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
