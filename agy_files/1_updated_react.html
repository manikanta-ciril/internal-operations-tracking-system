<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>CIRIL - Internal Operations Tracking System</title>

    <!-- Tailwind CSS, React 18 & Babel Standalone -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                screens: {
                    'xs': '375px',
                    'sm': '640px',
                    'md': '768px',
                    'lg': '1024px',
                    'xl': '1280px',
                },
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9ddfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#0f172a',
                        }
                    },
                    animation: {
                        'modal-in': 'modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                        'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        modalIn: {
                            '0%': { opacity: '0', transform: 'scale(0.96) translateY(6px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        
        html, body {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Safe area support for mobile devices with notches */
        .safe-area-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Modern Glassmorphic Minimal Background */
        body {
            background-color: #f8fafc;
        }
        .dark body {
            background-color: #0b0f19;
        }

        /* Subtle responsive dot pattern */
        .saas-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .saas-pattern {
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
        }

        /* Ambient responsive backlight - monochrome */
        .glow-ambient {
            position: absolute;
            width: min(500px, 100vw);
            height: min(500px, 100vw);
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(148, 163, 184, 0.15) 0%, rgba(148, 163, 184, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }
        .dark .glow-ambient {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
        }
        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .spinner-saas {
            width: 18px;
            height: 18px;
            border: 2px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: spin 0.65s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Clean vector icons
        const BuildingIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
                <path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
            </svg>
        );

        const LockIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        );

        const UserIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        );

        const EyeIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
        );

        const EyeOffIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
        );

        const ArrowRightIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
        );

        const SunIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
        );

        const MoonIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        );

        const CheckCircleIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );

        const AlertCircleIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        );

        const App = () => {
            const [empId, setEmpId] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [rememberMe, setRememberMe] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(false);

            // Modals
            const [validationModalOpen, setValidationModalOpen] = useState(false);
            const [infoModal, setInfoModal] = useState(null); // 'privacy' | 'security' | 'helpdesk' | null

            // Auth flow
            const [phase, setPhase] = useState('idle'); // 'idle' | 'loading' | 'success'

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // Keyboard shortcut to close modals with ESC
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setValidationModalOpen(false);
                        setInfoModal(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();

                if (!empId.trim() || !password.trim()) {
                    setValidationModalOpen(true);
                    return;
                }

                setPhase('loading');
                await new Promise(r => setTimeout(r, 1000));
                setPhase('success');
            };

            const fillDemo = (id, pass) => {
                setEmpId(id);
                setPassword(pass);
            };

            return (
                <div className={`min-h-screen w-full relative flex flex-col justify-between saas-pattern transition-colors duration-300 safe-area-top safe-area-bottom ${
                    isDarkMode ? 'dark text-slate-100' : 'text-slate-900'
                }`}>
                    {/* Top Navigation Bar: Fully Responsive */}
                    <header className="relative z-10 w-full max-w-6xl mx-auto px-4 xs:px-6 py-4 sm:py-6 flex items-center justify-between">
                        <div className="flex items-center space-x-2.5 sm:space-x-3.5 min-w-0">
                            <img
                                src="../img/logo.png"
                                onError={(e) => { e.target.onerror = null; e.target.src = "./img/logo.png"; }}
                                alt="CIRIL"
                                className="h-7 sm:h-9 w-auto object-contain shrink-0 transition-transform duration-200 hover:scale-105"
                            />
                            <div className="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 shrink-0"></div>
                            <span className="text-[11px] sm:text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase truncate">
                                Operations Portal
                            </span>
                        </div>

                        {/* Theme Switcher: accessible min 44x44px touch target */}
                        <button
                            type="button"
                            onClick={() => setIsDarkMode(!isDarkMode)}
                            aria-label="Toggle theme"
                            className="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl border border-white/50 dark:border-slate-700/50 bg-white/40 dark:bg-slate-800/40 backdrop-blur-md text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0_4px_16px_rgba(0,0,0,0.1)] hover:-translate-y-0.5 transition-all duration-300"
                        >
                            <div className="transition-transform duration-300 hover:rotate-45">
                                {isDarkMode ? <SunIcon className="w-4 h-4 text-amber-400" /> : <MoonIcon className="w-4 h-4 text-slate-600" />}
                            </div>
                        </button>
                    </header>

                    {/* Centered SaaS Content Container: Scales fluidly across 320px - 1440px+ */}
                    <main className="relative z-10 flex-1 flex items-center justify-center px-4 py-4 sm:py-8 md:py-12">
                        {/* Ambient Backlight */}
                        <div className="glow-ambient"></div>

                        <div className="relative w-full max-w-[440px] bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl rounded-2xl sm:rounded-3xl border border-white/40 dark:border-slate-700/50 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] shadow-[inset_0_1px_1px_rgba(255,255,255,0.6)] dark:shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] p-5 xs:p-7 sm:p-9 md:p-10 animate-slide-up transition-all duration-500 hover:shadow-[0_8px_32px_0_rgba(31,38,135,0.12)] hover:-translate-y-1">
                            
                            {/* Card Header & Badge */}
                            <div className="text-center mb-6 sm:mb-8">
                                <div className="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-100/80 dark:bg-slate-800/60 border border-slate-200/50 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 text-[10px] sm:text-[11px] font-semibold tracking-wide mb-3 sm:mb-4 transition-colors hover:bg-slate-200/60">
                                    <span className="w-1.5 h-1.5 rounded-full bg-slate-700 dark:bg-slate-400 animate-pulse"></span>
                                    <span>CIRIL Network Portal</span>
                                </div>
                                <h1 className="text-xl xs:text-2xl sm:text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-br from-slate-900 to-slate-600 dark:from-white dark:to-slate-400 drop-shadow-sm">
                                    Welcome back
                                </h1>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 sm:mt-1.5 leading-relaxed">
                                    Internal Operations Tracking System
                                </p>
                            </div>

                            {/* Normal Form Phase */}
                            {phase === 'idle' && (
                                <form onSubmit={handleLogin} noValidate className="space-y-4">
                                    {/* Employee ID Input */}
                                    <div className="space-y-1.5">
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                                            Employee ID
                                        </label>
                                        <div className="relative group">
                                            <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors pointer-events-none">
                                                <UserIcon className="w-4 h-4" />
                                            </div>
                                            <input
                                                type="text"
                                                value={empId}
                                                onChange={(e) => setEmpId(e.target.value)}
                                                placeholder="e.g. EMP-9382"
                                                /* text-base on mobile prevents iOS Safari automatic zoom */
                                                className="w-full pl-10 pr-3.5 py-2.5 sm:py-2.5 rounded-xl border border-white/50 dark:border-slate-700/50 bg-white/40 dark:bg-slate-800/40 shadow-[inset_0_2px_4px_rgba(0,0,0,0.04)] dark:shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)] backdrop-blur-md text-base sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:bg-white/80 dark:focus:bg-slate-800/80 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all duration-300 min-h-[44px]"
                                            />
                                        </div>
                                    </div>

                                    {/* Password Input */}
                                    <div className="space-y-1.5">
                                        <div className="flex items-center justify-between">
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                                                Password
                                            </label>
                                            <button
                                                type="button"
                                                onClick={() => setInfoModal('helpdesk')}
                                                className="text-xs text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:underline font-medium transition-colors p-1 -mr-1"
                                            >
                                                Need help?
                                            </button>
                                        </div>
                                        <div className="relative group">
                                            <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors pointer-events-none">
                                                <LockIcon className="w-4 h-4" />
                                            </div>
                                            <input
                                                type={showPassword ? "text" : "password"}
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full pl-10 pr-11 py-2.5 sm:py-2.5 rounded-xl border border-white/50 dark:border-slate-700/50 bg-white/40 dark:bg-slate-800/40 shadow-[inset_0_2px_4px_rgba(0,0,0,0.04)] dark:shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)] backdrop-blur-md text-base sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:bg-white/80 dark:focus:bg-slate-800/80 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all duration-300 min-h-[44px]"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowPassword(!showPassword)}
                                                className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-2 rounded-lg"
                                                aria-label={showPassword ? "Hide password" : "Show password"}
                                            >
                                                {showPassword ? <EyeOffIcon className="w-4 h-4" /> : <EyeIcon className="w-4 h-4" />}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Remember Me Checkbox */}
                                    <div className="flex items-center justify-between pt-0.5">
                                        <label className="flex items-center space-x-2 cursor-pointer select-none text-xs text-slate-600 dark:text-slate-400 min-h-[32px]">
                                            <input
                                                type="checkbox"
                                                checked={rememberMe}
                                                onChange={(e) => setRememberMe(e.target.checked)}
                                                className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 transition-all cursor-pointer"
                                            />
                                            <span>Remember session</span>
                                        </label>
                                    </div>

                                    {/* Primary Sign In Button */}
                                    <div className="pt-2">
                                        <button
                                            type="submit"
                                            className="group relative w-full min-h-[46px] rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-bold transition-all duration-300 active:scale-[0.98] flex items-center justify-center space-x-2 shadow-[0_4px_14px_0_rgba(0,0,0,0.15)] dark:shadow-[0_4px_14px_0_rgba(255,255,255,0.15)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.2)] dark:hover:shadow-[0_6px_20px_rgba(255,255,255,0.2)] hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900 cursor-pointer overflow-hidden"
                                        >
                                            <span>Sign in</span>
                                            <ArrowRightIcon className="w-4 h-4 transition-transform duration-200 group-hover:translate-x-0.5" />
                                        </button>
                                    </div>

                                    {/* Quick Demo Fill Pills for Testing: Responsive grid/flex */}
                                    <div className="pt-4 border-t border-slate-100 dark:border-slate-800/80">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[11px] font-medium text-slate-400 dark:text-slate-500">
                                                Quick demo autofill:
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-3 gap-1.5 xs:gap-2">
                                            <button
                                                type="button"
                                                onClick={() => fillDemo('EMP-8492', 'ciril_ops_2026')}
                                                className="min-h-[36px] py-1.5 px-1.5 xs:px-2 rounded-lg bg-slate-100/70 dark:bg-slate-800/60 hover:bg-blue-50 dark:hover:bg-blue-950/40 border border-slate-200/60 dark:border-slate-700/60 text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition-all text-center truncate"
                                            >
                                                Manager
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => fillDemo('EMP-4210', 'ciril_broker_2026')}
                                                className="min-h-[36px] py-1.5 px-1.5 xs:px-2 rounded-lg bg-slate-100/70 dark:bg-slate-800/60 hover:bg-blue-50 dark:hover:bg-blue-950/40 border border-slate-200/60 dark:border-slate-700/60 text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition-all text-center truncate"
                                            >
                                                Broker
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => fillDemo('EMP-1001', 'ciril_admin_2026')}
                                                className="min-h-[36px] py-1.5 px-1.5 xs:px-2 rounded-lg bg-slate-100/70 dark:bg-slate-800/60 hover:bg-blue-50 dark:hover:bg-blue-950/40 border border-slate-200/60 dark:border-slate-700/60 text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition-all text-center truncate"
                                            >
                                                Admin
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            )}

                            {/* Loading State */}
                            {phase === 'loading' && (
                                <div className="py-8 text-center space-y-3 animate-fade-in">
                                    <div className="inline-flex items-center justify-center w-11 h-11 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md">
                                        <div className="spinner-saas"></div>
                                    </div>
                                    <h3 className="text-sm font-semibold text-slate-900 dark:text-white">
                                        Authenticating employee token...
                                    </h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">
                                        Connecting to CIRIL operations network
                                    </p>
                                </div>
                            )}

                            {/* Success State */}
                            {phase === 'success' && (
                                <div className="py-6 text-center space-y-3 animate-fade-in">
                                    <div className="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <CheckCircleIcon className="w-6 h-6" />
                                    </div>
                                    <h3 className="text-base font-bold text-slate-900 dark:text-white">
                                        Access Authorized
                                    </h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">
                                        Routing to your operational workspace...
                                    </p>
                                    <div className="pt-3">
                                        <button
                                            type="button"
                                            onClick={() => setPhase('idle')}
                                            className="min-h-[44px] px-4 py-2 text-xs text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:underline font-medium"
                                        >
                                            Return to login form
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* SaaS Footer: Stacks gracefully on mobile */}
                    <footer className="relative z-10 w-full max-w-6xl mx-auto px-4 xs:px-6 py-4 sm:py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200/60 dark:border-slate-800/60">
                        <div>© 2026 CIRIL Real Estate Network. Internal operations portal.</div>
                        <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
                            <span onClick={() => setInfoModal('privacy')} className="hover:text-slate-600 dark:hover:text-slate-300 transition-colors cursor-pointer">Privacy</span>
                            <span>•</span>
                            <span onClick={() => setInfoModal('security')} className="hover:text-slate-600 dark:hover:text-slate-300 transition-colors cursor-pointer">Security</span>
                            <span>•</span>
                            <span onClick={() => setInfoModal('helpdesk')} className="hover:text-slate-600 dark:hover:text-slate-300 transition-colors cursor-pointer">IT Helpdesk</span>
                        </div>
                    </footer>

                    {/* ========================================================= */}
                    {/* ELEGANT RESPONSIVE DIALOG 1: VALIDATION ERROR             */}
                    {/* ========================================================= */}
                    {validationModalOpen && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-3 xs:p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in"
                            onClick={() => setValidationModalOpen(false)}
                            role="dialog"
                            aria-modal="true"
                        >
                            <div
                                className="w-full max-w-sm rounded-2xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl border border-white/50 dark:border-slate-700/50 shadow-[0_16px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_16px_40px_rgba(0,0,0,0.4)] p-5 sm:p-6 animate-modal-in transition-all"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex items-start space-x-3 mb-4">
                                    <div className="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 shrink-0 border border-slate-200 dark:border-slate-700">
                                        <AlertCircleIcon className="w-5 h-5" />
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h3 className="text-sm xs:text-base font-semibold text-slate-900 dark:text-white">
                                            Required fields missing
                                        </h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                                            Please provide both your Employee ID and password to access the CIRIL network.
                                        </p>
                                    </div>
                                </div>
                                <div className="flex flex-col-reverse xs:flex-row items-stretch xs:items-center justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setValidationModalOpen(false);
                                            fillDemo('EMP-8492', 'ciril_ops_2026');
                                        }}
                                        className="min-h-[40px] px-3 py-2 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-center"
                                    >
                                        Autofill Demo
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setValidationModalOpen(false)}
                                        className="min-h-[40px] px-4 py-2 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors shadow-xs text-center"
                                    >
                                        Got it
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* UNIFIED RESPONSIVE DIALOG: PAGES                          */}
                    {/* ========================================================= */}
                    {infoModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-3 xs:p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in"
                            onClick={() => setInfoModal(null)}
                            role="dialog"
                            aria-modal="true"
                        >
                            <div
                                className="w-full max-w-sm rounded-2xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl border border-white/50 dark:border-slate-700/50 shadow-[0_16px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_16px_40px_rgba(0,0,0,0.4)] p-5 sm:p-6 animate-modal-in transition-all"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex items-start space-x-3 mb-4">
                                    <div className="flex-1 min-w-0">
                                        <h3 className="text-sm xs:text-base font-bold text-slate-900 dark:text-white capitalize">
                                            {infoModal === 'helpdesk' ? 'IT Helpdesk & Recovery' : infoModal}
                                        </h3>
                                    </div>
                                </div>
                                <div className="p-3 sm:p-4 rounded-xl bg-slate-50/50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700/50 text-xs text-slate-600 dark:text-slate-300 space-y-2 mb-4 leading-relaxed">
                                    {infoModal === 'privacy' && <p>Your data is processed in accordance with CIRIL's internal privacy guidelines. All interactions are logged for operational security.</p>}
                                    {infoModal === 'security' && <p>This network utilizes end-to-end encryption. Unauthorized access attempts will be automatically reported to the CIRIL Infosec team.</p>}
                                    {infoModal === 'helpdesk' && (
                                        <>
                                            <p>Employee credentials are synchronized with CIRIL internal identity records.</p>
                                            <p className="pt-1 border-t border-slate-200 dark:border-slate-700">Please contact your department IT analyst or message <strong>#it-operations</strong> on Slack if you cannot access your account.</p>
                                        </>
                                    )}
                                </div>
                                <div className="flex justify-end">
                                    <button
                                        type="button"
                                        onClick={() => setInfoModal(null)}
                                        className="w-full xs:w-auto min-h-[40px] px-5 py-2 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors shadow-xs"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
