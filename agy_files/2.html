<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRIL - 21st.dev Vibe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <style>
        body { background: #000; color: #ededed; font-family: 'Inter', sans-serif; }
        .bg-grid { background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px); mask-image: radial-gradient(circle at center, black, transparent 80%); }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Grid and Glow Effects -->
    <div class="absolute inset-0 bg-grid pointer-events-none"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    
    <!-- Main Card -->
    <div class="relative z-10 w-full max-w-sm p-8 rounded-[24px] bg-[#0a0a0a]/80 backdrop-blur-xl border border-white/10 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
        <div class="mb-8 flex flex-col items-center text-center">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-b from-white to-gray-400 text-black flex items-center justify-center font-bold text-xl mb-5 shadow-[0_0_20px_rgba(255,255,255,0.2)]">C</div>
            <h1 class="text-2xl font-semibold tracking-tight text-white mb-1.5">Sign in to CIRIL</h1>
            <p class="text-sm text-neutral-400">Welcome back to the command center.</p>
        </div>
        
        <form class="space-y-4">
            <div>
                <input type="text" placeholder="Employee ID" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-white/30 focus:bg-white/10 transition-all">
            </div>
            <div>
                <input type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-white/30 focus:bg-white/10 transition-all">
            </div>
            <button type="button" class="w-full mt-2 bg-white hover:bg-neutral-200 text-black font-semibold py-3 rounded-xl text-sm transition-all duration-200 shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:shadow-[0_0_30px_rgba(255,255,255,0.3)]">
                Access Workspace
            </button>
        </form>
        
        <p class="mt-6 text-center text-xs text-neutral-500 hover:text-neutral-300 transition-colors cursor-pointer">
            Secured by CIRIL Infosec
        </p>
    </div>
</body>
</html>
